services:
  db:
    image: postgis/postgis:16-3.4
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file: .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    volumes:
      # 🔑 Montage du code source (au lieu du COPY du Dockerfile)
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      - ./alembic.ini:/srv/alembic.ini:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      FORWARDED_ALLOW_IPS: "*"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8093"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      # Pour du hot-reload en dev, décommente :
      # - --reload
    volumes:
      # 🔑 Override le COPY du Dockerfile
      - ./app:/srv/app
      - ./alembic:/srv/alembic
      - ./alembic.ini:/srv/alembic.ini:ro
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8093/health\").status == 200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    env_file: .env
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    volumes:
      - ./app:/srv/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    volumes:
      - ./app:/srv/app
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: