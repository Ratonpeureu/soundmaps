<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SunuSound · Invitations</title><link rel="stylesheet" href="admin.css"></head><body>
<script src="admin.js"></script>
<script>
boot({page:'invit',roles:['tenant_admin'],ready:init});
function init(){
 $('#main').innerHTML=`<h2>Invitations et analyseurs</h2><div class="sub">Invitez de nouveaux contributeurs et gérez les analyseurs de confiance.</div>
 <div class="card"><h3>Créer des codes d'invitation</h3><div class="row"><label class="f">Nombre de codes<input id="n" type="number" value="1" min="1" max="50" style="width:110px"></label><label class="f">Utilisations par code<input id="u" type="number" value="1" min="1" max="1000" style="width:130px"></label><label class="f">Valable (jours)<input id="d" type="number" value="30" min="1" max="365" style="width:110px"></label><label class="f sp">Note (facultatif)<input id="note" maxlength="120" placeholder="Ex : Campagne Thiès"></label><button class="btn" id="go">Créer</button></div></div>
 <div class="card tw" style="padding:0"><div style="padding:14px"><h3 style="margin:0">Codes d'invitation</h3></div><table><thead><tr><th>Code</th><th>Type</th><th>Utilisations</th><th>Expire</th><th>Statut</th><th>Note</th><th></th></tr></thead><tbody id="inv"></tbody></table></div>
 <div class="card tw" style="padding:0"><div style="padding:14px"><h3 style="margin:0">Analyseurs actifs</h3><div class="sub">Contributeurs fiables qui donnent leur avis sur les mesures proches.</div></div><table><thead><tr><th>Analyseur</th><th>Depuis</th><th>Avis (60 j)</th><th>Concordance</th><th>Suspendu jusqu'au</th><th></th></tr></thead><tbody id="an"></tbody></table></div>`;
 $('#go').onclick=async()=>{try{const r=await api('/account/invitations/admin',{method:'POST',body:{count:+$('#n').value,max_uses:+$('#u').value,ttl_days:+$('#d').value,note:$('#note').value||null}});toast(r.length+' code(s) créé(s) : '+r.map(i=>i.code).join(', '));loadInv()}catch(e){toast(e.message,1)}};
 $('#inv').onclick=async e=>{const id=e.target.dataset.id;if(!id||!confirm('Révoquer ce code ?'))return;try{await api('/account/invitations/'+id,{method:'DELETE'});loadInv()}catch(x){toast(x.message,1)}};
 $('#an').onclick=async e=>{try{if(e.target.dataset.s){await api('/analyst/admin/'+e.target.dataset.s+'/suspend',{method:'POST',body:{days:14}});toast('Suspendu 14 jours')}if(e.target.dataset.r){await api('/analyst/admin/'+e.target.dataset.r+'/reinstate',{method:'POST'});toast('Réintégré')}loadAn()}catch(x){toast(x.message,1)}};
 loadInv();loadAn()}
async function loadInv(){try{const l=await api('/account/invitations/all');$('#inv').innerHTML=l.map(i=>`<tr><td><b style="letter-spacing:.08em">${esc(i.code)}</b></td><td>${i.kind==='admin'?'Admin':'Contributeur'}</td><td>${i.uses}/${i.max_uses}</td><td>${fd(i.expires_at,0)}</td><td><span class="chip ${i.active?'active':'closed'}">${i.active?'Actif':'Inactif'}</span></td><td>${esc(i.note||'')}</td><td>${i.active?`<button class="btn er sm" data-id="${esc(i.id)}">Révoquer</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Aucune invitation.</td></tr>'}catch(e){toast(e.message,1)}}
async function loadAn(){try{const l=await api('/analyst/admin/list');$('#an').innerHTML=l.map(a=>`<tr><td><b>${esc(a.display_name)}</b><div class="sub">${esc(a.pseudonym)}</div></td><td>${fd(a.since,0)}</td><td>${a.votes}</td><td>${Math.round(a.agreement*100)} %</td><td>${fd(a.suspended_until,0)}</td><td style="white-space:nowrap"><button class="btn wa sm" data-s="${esc(a.user_id)}">Suspendre 14 j</button> <button class="btn sec sm" data-r="${esc(a.user_id)}">Réintégrer</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucun analyseur.</td></tr>'}catch(e){toast(e.message,1)}}
</script></body></html>
