<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SunuSound · Études</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e4e8f0;--pr:#0e9f9a;--pr2:#0b7f7b;--prs:#0e9f9a14;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--sh:0 1px 2px #0f172a0d,0 6px 20px #0f172a0a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1116;--card:#141c24;--tx:#e8eef3;--mu:#8da0ad;--bd:#25313b;--prs:#0e9f9a22;--sh:0 1px 2px #0006}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
h2,h3,h4{margin:0}.mu{color:var(--mu)}.sm{font-size:12px}.grow{flex:1 1 220px}.sp{flex:1}[hidden]{display:none!important}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:800;font-size:17px;color:var(--pr);margin-bottom:12px}.brand small{display:block;color:var(--mu);font-weight:500;font-size:12px}
.side button,.side a{display:flex;gap:10px;align-items:center;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mu);font:inherit;font-weight:600;text-decoration:none;text-align:left}
.side button.on{background:var(--prs);color:var(--pr)}.side button:hover,.side a:hover{background:var(--prs)}
.side .who{margin-top:auto;font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:6px}
main{padding:26px 30px 120px;max-width:1180px;width:100%}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side .who{margin:0 0 0 auto;flex-direction:row;align-items:center}main{padding:16px 14px 120px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-top:16px}
.card h3{font-size:15px;margin-bottom:4px}.card>.mu{margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}.row>.f{flex:1 1 170px}.sb{justify-content:space-between;align-items:center}
.f{display:flex;flex-direction:column;gap:5px;margin-top:10px}.f>span{font-size:12px;font-weight:600;color:var(--mu)}.f small,.ck small{color:var(--mu);font-size:11.5px;font-weight:400}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prs)}
textarea{resize:vertical}
.ck{display:flex;gap:9px;align-items:flex-start;cursor:pointer;margin-top:10px;font-size:13.5px}.ck input{width:auto;margin-top:3px;accent-color:var(--pr)}.ck span{display:flex;flex-direction:column}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--pr);color:#fff;white-space:nowrap}.btn:hover{background:var(--pr2)}
.btn.sec{background:var(--prs);color:var(--pr)}.btn.ghost{background:transparent;color:var(--mu);border:1px solid var(--bd)}.btn.danger{background:var(--er)}.btn.ok{background:var(--ok)}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.5}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd);color:var(--mu);margin:1px 3px 1px 0}
.chip.active,.chip.validated,.chip.granted,.chip.delivered{background:#16a34a1f;color:var(--ok)}.chip.paused,.chip.indicative,.chip.pending,.chip.entered{background:#d977061f;color:var(--wa)}.chip.closed,.chip.rejected,.chip.refused,.chip.revoked{background:#dc26261f;color:var(--er)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);padding:4px;border-radius:12px;flex-wrap:wrap}.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--mu)}.seg button.on{background:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:16px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.15s}.sc:hover{border-color:var(--pr);transform:translateY(-2px)}
.bar{height:7px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:6px}
.empty{text-align:center;padding:50px 20px;color:var(--mu)}.empty b{display:block;font-size:17px;color:var(--tx);margin-bottom:6px}
.eh{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.eh h2{font-size:22px}
.steps{display:flex;gap:6px;overflow:auto;margin-top:16px;border-bottom:1px solid var(--bd);padding-bottom:0}.steps button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}.steps button.on{color:var(--pr);border-bottom-color:var(--pr)}.steps i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bd);font-size:11px;margin-right:6px}
.steps button.on i{background:var(--pr);color:#fff}.steps .gap{width:1px;background:var(--bd);margin:6px 6px}
.page{border:2px solid var(--pr);border-radius:16px;padding:14px;margin-top:18px;background:var(--prs)}
.blk{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-top:12px}.bh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.bh .bi{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:9px;background:var(--prs);color:var(--pr);font-weight:800}.bb{padding:4px 16px 16px}
.bh select{width:auto;padding:4px 8px;font-size:12px}
.sub{font-weight:700;font-size:12px;color:var(--mu);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.sub2{background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:12px;margin-top:10px}
.li{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}.li input[type=text],.li input:not([type]){flex:1 1 200px}.li .ck{margin:0;font-size:12px}
details.adv{margin-top:14px}details.adv>summary{cursor:pointer;color:var(--pr);font-weight:700;padding:4px 0}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bd)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 24px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:30;box-shadow:0 -6px 20px #0f172a14}
.ov{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--card);border-radius:18px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0006}.dlg.wide{max-width:860px}.dlg h3{font-size:18px;margin-bottom:8px}.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;right:18px;top:18px;background:var(--tx);color:var(--bg);padding:11px 16px;border-radius:12px;z-index:80;max-width:420px;box-shadow:var(--sh)}.toast.er{background:var(--er);color:#fff}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.pal button{border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:12px;text-align:left;cursor:pointer}.pal button:hover{border-color:var(--pr)}.pal b{display:block}.pal span{font-size:12px;color:var(--mu)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.mg .it{border:2px solid var(--bd);border-radius:12px;padding:6px;cursor:pointer;text-align:center;font-size:12px}.mg .it:hover{border-color:var(--pr)}.mg img{width:100%;height:80px;object-fit:cover;border-radius:8px}.mg .vid{height:80px;display:grid;place-items:center;background:var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.tile{background:var(--bg);border-radius:12px;padding:12px}.tile b{display:block;font-size:22px}.tile span{font-size:12px;color:var(--mu)}
.check li{list-style:none;margin:4px 0}.check{padding:0;margin:0}.ok-t{color:var(--ok)}.ko-t{color:var(--er)}
.phone{width:330px;max-width:100%;margin:auto;border:10px solid #1e293b;border-radius:34px;padding:16px;background:var(--card);max-height:70vh;overflow:auto}.phone .q{margin:14px 0}.phone .opt{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:5px 0}.pvimg{width:100%;border-radius:10px;margin:6px 0}
#login{max-width:380px;margin:12vh auto;padding:0 16px}#login .card{display:flex;flex-direction:column;gap:10px}
.hb{display:flex;gap:6px;flex-wrap:wrap}.hb label{display:flex;gap:4px;align-items:center;font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:3px 10px;cursor:pointer}.hb input{width:auto;accent-color:var(--pr)}
</style></head><body>

<div id="login"><div class="card"><h2 style="color:var(--pr)">SunuSound · Études</h2><p class="mu" style="margin:0">Connectez-vous avec un compte administrateur.</p>
<label class="f"><span>Adresse du serveur</span><input id="l-api"></label>
<label class="f"><span>E-mail</span><input id="l-email" type="email" autocomplete="username"></label>
<label class="f"><span>Mot de passe</span><input id="l-pass" type="password" autocomplete="current-password"></label>
<button class="btn" id="l-go">Se connecter</button><div id="l-err" style="color:var(--er)"></div></div></div>

<div id="app" class="app" hidden>
<aside class="side"><div class="brand">SunuSound<small>Études &amp; sondages</small></div>
<button data-tab="studies" class="on">📋 Mes études</button><button data-tab="sponsors">🏢 Organisations</button><button data-tab="media">🖼 Médiathèque</button>
<a href="index.html">📈 Mesures</a><a href="surveys.html">🗂 Enquêtes</a><a href="invitations.html">✉ Invitations</a>
<div class="who"><span id="who"></span><button id="logout" class="btn ghost sm">Déconnexion</button></div></aside>
<main>
<section id="tab-studies"><div id="list"></div><div id="editor" hidden></div></section>
<section id="tab-sponsors" hidden></section>
<section id="tab-media" hidden></section>
</main></div>
<div id="modal" class="ov" hidden></div>
<div id="savebar" class="savebar" hidden><span>Vous avez des modifications non enregistrées.</span><button class="btn" data-act="save">Enregistrer</button></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,er)=>{const t=document.createElement('div');t.className='toast'+(er?' er':'');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),er?7000:3500)};
const fd=s=>s?new Date(s).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'—';
const clone=o=>JSON.parse(JSON.stringify(o));
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
const arr=p=>{let a=getP(E,p);if(!a){setP(E,p,[]);a=getP(E,p)}return a};
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
const toLoc=iso=>{if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const merge=(d,s)=>{if(s==null)return clone(d);const o={...d};for(const k of Object.keys(s)){const a=d[k],b=s[k];o[k]=(a&&typeof a==='object'&&!Array.isArray(a)&&b&&typeof b==='object'&&!Array.isArray(b))?merge(a,b):b}return o};
const S={base:localStorage.getItem('ss_api')||'https://soundmaps.rhmanager.site/api/v1',access:sessionStorage.getItem('ss_at'),refresh:sessionStorage.getItem('ss_rt'),me:null,meta:null,sponsors:[],assets:[],studies:[],filter:'all',q:''};
let E=null,refreshing=null,MCB=null,PMCB=null;const thumbs={};

// ================= API
const saveTokens=(a,r)=>{S.access=a;S.refresh=r;sessionStorage.setItem('ss_at',a);sessionStorage.setItem('ss_rt',r)};
const logout=()=>{S.access=S.refresh=null;sessionStorage.clear();$('#app').hidden=true;$('#login').hidden=false};
async function refreshTokens(){if(!S.refresh)return false;refreshing||=fetch(S.base+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh})}).then(async r=>{if(!r.ok)return false;const d=await r.json();saveTokens(d.access_token,d.refresh_token);return true}).catch(()=>false).finally(()=>refreshing=null);return refreshing}
async function raw(path,{method='GET',body,query,form}={},retry=true){
 const url=new URL(S.base+path);for(const[k,v]of Object.entries(query||{})){if(Array.isArray(v))v.forEach(x=>url.searchParams.append(k,x));else if(v!==''&&v!=null)url.searchParams.set(k,v)}
 let r;try{r=await fetch(url,{method,headers:{...(body?{'Content-Type':'application/json'}:{}),Authorization:'Bearer '+S.access},body:form||(body?JSON.stringify(body):undefined)})}catch{throw new Error('Serveur injoignable. Vérifiez votre connexion.')}
 if(r.status===401&&retry&&await refreshTokens())return raw(path,{method,body,query,form},false);
 if(r.status===401){logout();throw new Error('Session expirée, reconnectez-vous.')}return r}
async function api(path,o){const r=await raw(path,o);const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(friendly(d,r.status));return d}
async function download(path,query,name){const r=await raw(path,{query});if(!r.ok)throw new Error('Téléchargement impossible');const u=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function loadThumbs(root){for(const img of $$('img[data-asset]',root)){const id=img.dataset.asset;try{thumbs[id]??=URL.createObjectURL(await(await raw('/study-assets/'+id)).blob());img.src=thumbs[id]}catch{}}}

// ================= Messages d'erreur lisibles
const ERR={invalid_credentials:'Identifiants incorrects.',insufficient_role:'Droits insuffisants.',study_not_found:'Étude introuvable.',sponsor_not_found:'Organisation introuvable.',sponsor_inactive:"L'organisation est désactivée.",sponsor_has_studies:"Cette organisation a des études : impossible de la supprimer.",end_date_required_in_future:'Indiquez une date de clôture située dans le futur pour publier.',study_not_deletable:'Seul un brouillon sans réponse peut être supprimé.',asset_in_use:'Ce média est utilisé : retirez-le d\'abord.',unsupported_media:'Format non accepté (JPEG, PNG, WebP, GIF, MP4, WebM).',media_too_large:'Fichier trop volumineux.',not_a_lottery:"Cette étude n'est pas un tirage au sort.",already_drawn:'Le tirage a déjà eu lieu.',invalid_transition:'Action impossible dans l\'état actuel.',definition_required:'Le questionnaire est vide.',
 text_required:'le texte est vide',bad_options:'il faut au moins 2 réponses différentes',bad_columns:'il faut au moins 2 colonnes',bad_rows:'il faut au moins 1 ligne',bad_items:'il faut au moins 1 produit',bad_criteria:'critères invalides',bad_scale:"l'échelle doit couvrir 2 à 11 valeurs",bad_stars:'entre 3 et 10 étoiles',bad_slider:'le minimum doit être inférieur au maximum',bad_bounds:'le minimum dépasse le maximum',media_required:'ajoutez une image ou une vidéo',duplicate_block:'identifiant en double',no_question:'ajoutez au moins une question',condition_unknown_question:"une condition s'appuie sur une question qui n'existe plus ou qui vient après",study_too_large:'questionnaire trop long',reward_label_required:'donnez un nom à la récompense',reward_amount_required:'indiquez le montant de la récompense',lottery_winners_required:'indiquez le nombre de gagnants',bad_value:'une valeur de critère est vide',bad_operator:'opérateur invalide',unknown_attribute:'critère inconnu',media_needs_asset_or_url:'média invalide',screen_not_allowed:'filtre non disponible pour ce type',attention_not_allowed:'contrôle non disponible pour ce type'};
function blockLabel(key){let n=0;for(const p of E?.definition?.pages||[])for(const b of p.blocks){if(ANSW.has(b.kind))n++;if(b.key===key)return ANSW.has(b.kind)?`Question ${n}`:(KINDS[b.kind]||[])[1]||key}return key}
function explain(e){const m=String(e).match(/([a-z_]+)(?::([\w\-.]+))?\s*$/);if(!m)return String(e);const t=ERR[m[1]];if(!t)return String(e).replace(/^.*?:\s*/,'');return (m[2]?blockLabel(m[2])+' : ':'')+t}
function friendly(d,status){const x=d?.detail;if(typeof x==='string')return ERR[x]||x;
 if(x&&x.code){let m=ERR[x.code]||x.code;if(x.errors&&x.errors.length)m=({invalid_definition:'Questionnaire incomplet',invalid_targeting:'Public visé invalide',invalid_reward:'Récompense invalide',invalid_privacy:'Confidentialité invalide'}[x.code]||m)+' — '+x.errors.map(explain).join(' ; ');return m}
 if(Array.isArray(x))return x.map(e=>e.msg).join(' ; ');return 'Erreur '+status}

// ================= Fenêtres
function modal(html,wide){const o=$('#modal');o.innerHTML=`<div class="dlg ${wide?'wide':''}">${html}</div>`;o.hidden=false}
function closeModal(){const o=$('#modal');o.hidden=true;o.innerHTML='';MCB=null;PMCB=null}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
function confirmBox(title,msg,ok='Confirmer',danger){return new Promise(res=>{modal(`<h3>${title}</h3><div>${msg}</div><div class="acts"><button class="btn ghost" data-act="mx" data-v="0">Annuler</button><button class="btn ${danger?'danger':''}" data-act="mx" data-v="1">${ok}</button></div>`);MCB=res})}

// ================= Connexion
$('#l-api').value=S.base;
$('#l-go').onclick=async()=>{$('#l-err').textContent='';S.base=$('#l-api').value.trim().replace(/\/+$/,'');localStorage.setItem('ss_api',S.base);
 try{const r=await fetch(S.base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#l-email').value.trim(),password:$('#l-pass').value})});const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(friendly(d,r.status));saveTokens(d.access_token,d.refresh_token);await start()}catch(e){$('#l-err').textContent=e.message}};
$('#l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#l-go').click()});
$('#logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST',body:{refresh_token:S.refresh}})}catch{}logout()};
async function start(){S.me=await api('/users/me');if(S.me.role!=='tenant_admin'){logout();throw new Error('Réservé aux administrateurs.')}
 $('#who').textContent=S.me.pseudonym;$('#login').hidden=true;$('#app').hidden=false;S.meta=await api('/study-admin/meta');await Promise.all([loadSponsors(),loadAssets()]);await loadStudies()}
$$('.side button[data-tab]').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
async function goTab(t){if(E?._dirty&&!await confirmBox('Quitter sans enregistrer ?','Vos modifications seront perdues.','Quitter',true))return;
 if(E){E=null;touch(false)}$$('.side button[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));['studies','sponsors','media'].forEach(x=>$('#tab-'+x).hidden=x!==t);
 if(t==='studies'){$('#editor').hidden=true;$('#list').hidden=false;loadStudies()}if(t==='sponsors')renderSponsors();if(t==='media')renderMedia()}
window.addEventListener('beforeunload',e=>{if(E?._dirty){e.preventDefault();e.returnValue=''}});

// ================= Médiathèque
async function loadAssets(){S.assets=await api('/study-admin/assets')}
function renderMedia(){const el=$('#tab-media');
 el.innerHTML=`<div class="eh"><h2>Médiathèque</h2><span class="sp"></span><label class="btn">＋ Ajouter un fichier<input type="file" id="md-file" accept="image/*,video/mp4,video/webm" hidden></label></div>
 <p class="mu">Images (JPEG, PNG, WebP, GIF) et vidéos (MP4, WebM) utilisables dans vos questionnaires et sur les fiches des organisations.</p>
 <div class="grid">${S.assets.map(a=>`<div class="sc" style="cursor:default">${a.kind==='image'?`<img data-asset="${a.id}" style="width:100%;height:130px;object-fit:cover;border-radius:10px;background:var(--bd)">`:'<div class="mg"><div class="vid" style="height:130px">▶ vidéo</div></div>'}<b>${esc(a.name)}</b><span class="mu sm">${a.kind==='image'?'Image':'Vidéo'} · ${Math.round(a.size_bytes/1024)} Ko</span><div class="row"><button class="btn sm sec" data-act="copy-id" data-id="${a.id}">Copier l'identifiant</button><button class="btn sm ghost" data-act="asset-del" data-id="${a.id}">Supprimer</button></div></div>`).join('')||'<div class="empty" style="grid-column:1/-1"><b>Aucun média</b>Ajoutez votre première image ou vidéo.</div>'}</div>`;
 loadThumbs(el);$('#md-file').onchange=e=>uploadAsset(e.target.files[0])}
async function uploadAsset(f,after){if(!f)return;const form=new FormData();form.append('file',f);
 try{const r=await raw('/study-admin/assets',{method:'POST',form});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(friendly(d,r.status));toast('Média ajouté');await loadAssets();if(after)after(d);else renderMedia()}catch(e){toast(e.message,1)}}

function issues(forPublish){const out=[],q=qIndex();
 if((E.title||'').trim().length<3)out.push('Donnez un titre à l\'étude (3 caractères minimum).');
 if(!E.sponsor_id)out.push('Choisissez l\'organisation qui commande l\'étude.');
 if(forPublish&&!(E.ends_at&&new Date(E.ends_at)>new Date()))out.push('Indiquez une date de clôture située dans le futur.');
 if(!allBlocks().some(b=>ANSW.has(b.kind)))out.push('Ajoutez au moins une question.');
 E.definition.pages.forEach((p,i)=>{if(!p.blocks.length)out.push(`La page ${i+1} est vide.`)});
 for(const b of allBlocks()){const n=ANSW.has(b.kind)?`Question ${q[b.key]}`:KINDS[b.kind][1];
  if((ANSW.has(b.kind)||b.kind==='info')&&(b.text||'').trim().length<2)out.push(`${n} : le texte est vide.`);
  if(['single_choice','multi_choice','ranking'].includes(b.kind)&&(b.options||[]).filter(o=>(o.label||'').trim()).length<2)out.push(`${n} : proposez au moins 2 réponses.`);
  if(b.kind==='matrix'&&((b.options||[]).filter(o=>o.label.trim()).length<2||!(b.rows||[]).filter(o=>o.label.trim()).length))out.push(`${n} : une grille demande 1 ligne et 2 colonnes minimum.`);
  if(b.kind==='product_rating'&&!(b.items||[]).filter(o=>o.label.trim()).length)out.push(`${n} : ajoutez au moins un produit.`);
  if(b.kind==='media'&&!(b.media||[]).length)out.push(`${n} : ajoutez une image ou une vidéo.`)}
 if(E.reward.enabled){if(!(E.reward.label||'').trim())out.push('Récompense : donnez-lui un nom.');if(['points','credits','cash','airtime'].includes(E.reward.kind)&&!(E.reward.amount>0))out.push('Récompense : indiquez un montant.');if(E.reward.mode==='lottery'&&!(E.reward.winners>0))out.push('Tirage au sort : indiquez le nombre de gagnants.')}
 return out}

function pageHtml(p,i){const P=`definition.pages.${i}`,D=E.definition.pages,btn=(a,l,t)=>`<button class="btn sm ghost" data-act="${a}" data-i="${i}" title="${t}">${l}</button>`;
 return `<div class="page"><div class="row sb"><b>Page ${i+1} <span class="mu" style="font-weight:400">— un écran du téléphone</span></b><span>${btn('p-up','↑','Monter')}${btn('p-dn','↓','Descendre')}${D.length>1?btn('p-del','✕','Supprimer la page'):''}</span></div>

 <details class="adv"><summary>Afficher cette page seulement si…</summary>${condEd(P+'.show_if',p.show_if,i,-1,'Cette page s\'affiche seulement si')}</details>
 ${p.blocks.map((b,j)=>blockHtml(i,j,b)).join('')}<div style="margin-top:14px"><button class="btn" data-act="palette" data-pi="${i}">＋ Ajouter une question ou un contenu</button></div></div>`}
function blockHtml(pi,bi,b){const P=`definition.pages.${pi}.blocks.${bi}`,k=b.kind,K=KINDS[k]||['?',k,''],ans=ANSW.has(k),qn=qIndex()[b.key];
 const ab=(a,l,t)=>`<button class="btn sm ghost" data-act="${a}" data-pi="${pi}" data-bi="${bi}" title="${t}">${l}</button>`;
 let h=`<div class="blk"><div class="bh"><span class="bi">${K[0]}</span><b>${ans?'Question '+qn:K[1]}</b><select data-p="${P}" data-t="kind" title="Changer le type">${Object.entries(KINDS).map(([x,v])=>`<option value="${x}" ${x===k?'selected':''}>${v[1]}</option>`).join('')}</select><span class="sp"></span>${ab('b-up','↑','Monter')}${ab('b-dn','↓','Descendre')}${ab('b-dup','⧉','Dupliquer')}${ab('b-del','✕','Supprimer')}</div><div class="bb">`;
 h+=txt(ans?'Votre question *':k==='info'?'Texte à afficher *':'Légende (facultatif)',P+'.text',{rows:2,ph:ans?'Ex : Quel opérateur utilisez-vous le plus ?':''});
 if(ans)h+=`<div class="row">${inp('Précision sous la question (facultatif)',P+'.help',{cls:'grow',ph:'Ex : Plusieurs réponses possibles'})}${chk('Réponse obligatoire',P+'.required')}</div>`;
 if(['single_choice','multi_choice','ranking'].includes(k)){h+=`<div class="sub">Réponses proposées</div>`+listEd(P+'.options',b.options,{pre:'o',key:'value',ph:'Texte de la réponse',flags:k==='multi_choice'?[['exclusive','Exclusive (« Aucune »)'],['other','Autre : précisez']]:k==='single_choice'?[['other','Autre : précisez']]:[],media:true});
  h+=`<div class="row">`+(k!=='ranking'?sel('Présentation',P+'.display',[['','Automatique'],['list','Liste'],['dropdown','Menu déroulant'],['images','Images'],['buttons','Boutons']],{t:'s'}):num('Classer seulement les N premiers',P+'.top_n',{t:'i',hint:'Vide = tous.'}))+(k==='multi_choice'?num('Minimum de choix',P+'.min_select',{t:'i'})+num('Maximum de choix',P+'.max_select',{t:'i'}):'')+chk('Mélanger l\'ordre des réponses',P+'.randomize')+`</div>`}
 if(k==='matrix')h+=`<div class="sub">Lignes (les affirmations à noter)</div>`+listEd(P+'.rows',b.rows,{pre:'r',key:'value',ph:'Ex : Rapidité du service'})+`<div class="sub">Colonnes (les choix de réponse)</div>`+listEd(P+'.options',b.options,{pre:'o',key:'value',ph:'Ex : D\'accord'});
 if(k==='product_rating')h+=`<div class="sub">Produits à noter</div>`+listEd(P+'.items',b.items,{pre:'p',key:'key',ph:'Nom du produit',desc:true,mlist:true})+`<div class="sub">Critères de notation</div>`+listEd(P+'.criteria',b.criteria,{pre:'c',key:'value',ph:'Ex : Goût, Prix, Emballage'})+`<div class="row">${num('Note minimale',P+'.min',{t:'i'})}${num('Note maximale',P+'.max',{t:'i'})}${chk('Autoriser un commentaire libre',P+'.allow_comment')}</div>`;
 if(k==='number'||k==='slider')h+=`<div class="row">${num('Valeur minimale',P+'.min')}${num('Valeur maximale',P+'.max')}${k==='slider'?num('Pas',P+'.step'):''}${inp('Unité',P+'.unit',{ph:'FCFA, ans, kg…'})}</div><div class="row">${chk('Nombre entier uniquement',P+'.integer')}${k==='slider'?inp('Texte à gauche',P+'.low_label')+inp('Texte à droite',P+'.high_label'):inp('Exemple affiché',P+'.placeholder')}</div>`;
 if(k==='scale')h+=`<div class="row">${num('De',P+'.min',{t:'i'})}${num('À',P+'.max',{t:'i'})}${inp('Texte pour la plus basse note',P+'.low_label',{ph:'Pas du tout'})}${inp('Texte pour la plus haute note',P+'.high_label',{ph:'Tout à fait'})}</div>`;
 if(k==='stars')h+=`<div class="row">${num('Nombre d\'étoiles (3 à 10)',P+'.max',{t:'i'})}</div>`;
 if(k==='nps')h+=`<div class="row">${inp('Texte pour 0',P+'.low_label',{ph:'Pas du tout probable'})}${inp('Texte pour 10',P+'.high_label',{ph:'Très probable'})}</div>`;
 if(k==='text'||k==='long_text')h+=`<div class="row">${num('Longueur minimale',P+'.min_length',{t:'i'})}${num('Longueur maximale',P+'.max_length',{t:'i'})}${inp('Exemple affiché',P+'.placeholder')}</div>`;
 h+=`<div class="sub">${k==='media'?'Image ou vidéo *':'Images / vidéos (facultatif)'}</div>`+mediaEd(P+'.media');

 <button class="btn sm ghost" data-act="li-up" data-p="${P}" data-i="${i}">↑</button><button class="btn sm ghost" data-act="li-dn" data-p="${P}" data-i="${i}">↓</button><button class="btn sm ghost" data-act="li-del" data-p="${P}" data-i="${i}">✕</button></div>`).join('')
 +`<button class="btn sm sec" style="margin-top:8px" data-act="li-add" data-p="${P}" data-pre="${o.pre}" data-key="${o.key}" ${o.mlist?'data-ml="1"':''}>＋ Ajouter</button>`}
function mediaEd(P){const a=getP(E,P)||[];
 return a.map((m,i)=>`<div class="li">${m.asset_id?`<img class="thumb" data-asset="${m.asset_id}">`:`<span class="mu sm" style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${esc(m.url)}</span>`}<span class="chip">${m.kind==='video'?'Vidéo':'Image'}</span><input data-p="${P}.${i}.caption" data-t="s" value="${esc(m.caption||'')}" placeholder="Légende (facultatif)"><button class="btn sm ghost" data-act="media-del" data-p="${P}" data-i="${i}">✕</button></div>`).join('')+`<button class="btn sm sec" style="margin-top:8px" data-act="media-add" data-p="${P}">＋ Ajouter une image ou une vidéo</button>`}

// logique conditionnelle
const NUMK=['number','slider','scale','stars','nps'];
const OPS=k=>{const a=[['answered','a répondu'],['not_answered','n\'a pas répondu']];if(k==='single_choice')return[['eq','a répondu'],['ne','n\'a pas répondu']].map((x,i)=>[x[0],i?'a répondu autre chose que':'a répondu'] ).concat(a.map(x=>[x[0],x[0]==='answered'?'a répondu (peu importe quoi)':'n\'a pas répondu à la question']));
 if(k==='multi_choice')return[['has','a coché'],...a.map(x=>[x[0],x[0]==='answered'?'a répondu (peu importe quoi)':'n\'a pas répondu'])];
 if(k==='yes_no')return[['eq','a répondu'],...a.map(x=>[x[0],x[0]==='answered'?'a répondu (peu importe quoi)':'n\'a pas répondu'])];
 if(NUMK.includes(k))return[['eq','a répondu exactement'],['gt','a répondu plus de'],['gte','a répondu au moins'],['lt','a répondu moins de'],['lte','a répondu au plus']];
 return a.map(x=>[x[0],x[0]==='answered'?'a répondu':'n\'a pas répondu'])};
const defVal=b=>!b?null:(b.kind==='single_choice'||b.kind==='multi_choice')?(b.options[0]?.value??null):b.kind==='yes_no'?true:NUMK.includes(b.kind)?(b.min??0):null;
const defRule=b=>({q:b.key,op:OPS(b.kind)[0][0],value:defVal(b)});
function condEd(P,c,pi,bi,label){const qs=prevQs(pi,bi),n=qIndex();
 if(!c)return qs.length?`<button class="btn sm sec" data-act="cond-add" data-p="${P}" data-pi="${pi}" data-bi="${bi}">＋ ${label}…</button>`:'<div class="mu sm" style="margin-top:8px">Disponible dès qu\'une question précède.</div>';
 return `<div class="sub2"><div class="row sb"><b>${label} :</b><button class="btn sm ghost" data-act="cond-clear" data-p="${P}">Retirer</button></div>${c.rules.length>1?sel('Il faut que',P+'.mode',[['all','toutes les conditions soient vraies'],['any','au moins une condition soit vraie']]):''}
 ${c.rules.map((r,i)=>{const R=`${P}.rules.${i}`,b=findB(r.q),k=b?.kind,list=qs.some(x=>x.key===r.q)?qs:[...qs,...(b?[b]:[])];
  return `<div class="li"><select data-p="${R}" data-t="cq">${list.map(x=>`<option value="${x.key}" ${x.key===r.q?'selected':''}>Q${n[x.key]} – ${esc((x.text||'').slice(0,40))}</option>`).join('')}</select>
  <select data-p="${R}" data-t="cop">${OPS(k).map(([v,l])=>`<option value="${v}" ${v===r.op?'selected':''}>${l}</option>`).join('')}</select>
  ${['answered','not_answered'].includes(r.op)?'':(k==='single_choice'||k==='multi_choice')?`<select data-p="${R}" data-t="cval">${b.options.map(o=>`<option value="${esc(o.value)}" ${o.value===r.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:k==='yes_no'?`<select data-p="${R}" data-t="cval"><option value="true" ${r.value===true?'selected':''}>Oui</option><option value="false" ${r.value===false?'selected':''}>Non</option></select>`:`<input type="number" data-p="${R}" data-t="cval" value="${esc(r.value??'')}" style="max-width:120px">`}
  <button class="btn sm ghost" data-act="rule-del" data-p="${P}" data-i="${i}">✕</button></div>`}).join('')}<button class="btn sm sec" style="margin-top:8px" data-act="rule-add" data-p="${P}" data-pi="${pi}" data-bi="${bi}">＋ Autre condition</button></div>`}
function screenEd(P,b){const s=b.screen,k=b.kind;
 if(!s)return `<div style="margin-top:10px"><button class="btn sm sec" data-act="scr-add" data-p="${P}">＋ Question filtre : écarter les personnes hors cible</button></div>`;
 let body='';const S0=P+'.screen',big=v=>Math.abs(v)>=1e9?'':v;
 if(k==='single_choice'||k==='multi_choice'){const o=b.options.map(x=>[x.value,x.label]);body=`<div class="sub">Réponses acceptées <span class="mu" style="text-transform:none">(rien de coché = tout le monde)</span></div>${chips(S0+'.allow',s.allow,o)}<div class="sub">Réponses qui écartent la personne</div>${chips(S0+'.deny',s.deny,o)}`}
 else if(k==='yes_no')body=F('Qui peut continuer ?',`<select data-p="${S0}" data-t="yn"><option value="">Tout le monde</option><option value="true" ${s.allow[0]===true?'selected':''}>Seulement ceux qui répondent « Oui »</option><option value="false" ${s.allow[0]===false?'selected':''}>Seulement ceux qui répondent « Non »</option></select>`);
 else if(k==='number'||k==='slider'){const rg=(l,key)=>`<div class="row"><label class="f"><span>${l} : de</span><input type="number" data-p="${S0}.${key}" data-t="range" data-i="0" value="${s[key][0]?big(s[key][0][0]):''}"></label><label class="f"><span>à</span><input type="number" data-p="${S0}.${key}" data-t="range" data-i="1" value="${s[key][0]?big(s[key][0][1]):''}"></label></div>`;body=rg('Valeurs acceptées','allow')+rg('Valeurs qui écartent la personne','deny')+'<small class="mu">Exemple : acceptés de 18 à 35 pour cibler les 18-35 ans.</small>'}
 else{const vals=[];for(let v=b.min??1;v<=(b.max??5);v++)vals.push([v,String(v)]);body=`<div class="sub">Notes acceptées</div>${chips(S0+'.allow',s.allow,vals,1)}<div class="sub">Notes qui écartent la personne</div>${chips(S0+'.deny',s.deny,vals,1)}`}
 return `<div class="sub2"><div class="row sb"><b>Question filtre</b><button class="btn sm ghost" data-act="scr-del" data-p="${P}">Retirer</button></div><p class="mu sm" style="margin:4px 0">Hors cible, la personne est remerciée et quitte l'étude.</p>${body}${inp('Message affiché aux personnes hors cible',S0+'.message',{ph:'Cette étude ne correspond pas à votre profil. Merci !'})}</div>`}
function attEd(P,b){const a=b.attention,k=b.kind;
 if(!a)return `<div style="margin-top:10px"><button class="btn sm sec" data-act="att-add" data-p="${P}">＋ Contrôle d'attention (question piège)</button></div>`;
 let f;if(k==='single_choice')f=`<select data-p="${P}.attention" data-t="att">${b.options.map(o=>`<option value="${esc(o.value)}" ${o.value===a.correct?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
 else if(k==='yes_no')f=`<select data-p="${P}.attention" data-t="att"><option value="true" ${a.correct===true?'selected':''}>Oui</option><option value="false" ${a.correct===false?'selected':''}>Non</option></select>`;
 else f=`<input type="number" data-p="${P}.attention" data-t="att" value="${esc(a.correct??'')}">`;
 return `<div class="sub2"><div class="row sb"><b>Contrôle d'attention</b><button class="btn sm ghost" data-act="att-del" data-p="${P}">Retirer</button></div><p class="mu sm" style="margin:4px 0">Servez-vous-en pour une question du type « Répondez “Oui” à cette question ». Une mauvaise réponse signale un participant inattentif.</p>${F('Réponse attendue',f)}</div>`}
function palette(pi){const g=(t,ks)=>`<div class="sub">${t}</div><div class="pal">${ks.map(k=>`<button data-act="b-add" data-pi="${pi}" data-k="${k}"><b>${KINDS[k][0]} ${KINDS[k][1]}</b><span>${KINDS[k][2]}</span></button>`).join('')}</div>`;
 modal(`<h3>Que voulez-vous ajouter ?</h3>${g('Questions',['single_choice','multi_choice','yes_no','number','slider','scale','stars','nps','text','long_text','ranking','matrix','date','product_rating'])}${g('Contenu sans réponse',['info','media'])}<div class="acts"><button class="btn ghost" data-act="mx">Fermer</button></div>`,true)}

// ================= Aperçu
function previewHtml(){const D=E.definition;let n=0;
 const media=l=>(l||[]).map(m=>m.kind==='video'?'<div class="opt">▶ Vidéo</div>':m.asset_id?`<img data-asset="${m.asset_id}" class="pvimg">`:`<img src="${esc(m.url)}" class="pvimg">`).join('');
 const blk=b=>{const ans=ANSW.has(b.kind);if(ans)n++;const o=(b.options||[]);let c='';
  switch(b.kind){case'single_choice':c=o.map(x=>`<div class="opt">○ ${esc(x.label)}</div>`).join('');break;case'multi_choice':c=o.map(x=>`<div class="opt">☐ ${esc(x.label)}</div>`).join('');break;case'yes_no':c='<div class="opt">Oui</div><div class="opt">Non</div>';break;
   case'number':c=`<input disabled placeholder="${esc(b.placeholder||'0')}"> ${esc(b.unit||'')}`;break;case'slider':c=`<input type="range" disabled><div class="row sb sm mu"><span>${esc(b.low_label||b.min)}</span><span>${esc(b.high_label||b.max)}</span></div>`;break;
   case'scale':{let r='';for(let v=b.min;v<=b.max;v++)r+=`<span class="chip">${v}</span>`;c=r+`<div class="row sb sm mu"><span>${esc(b.low_label||'')}</span><span>${esc(b.high_label||'')}</span></div>`;break}
   case'stars':c='★'.repeat(b.max||5);break;case'nps':{let r='';for(let v=0;v<=10;v++)r+=`<span class="chip">${v}</span>`;c=r;break}
   case'text':c='<input disabled>';break;case'long_text':c='<textarea disabled rows="3"></textarea>';break;case'date':c='<input type="date" disabled>';break;
   case'ranking':c=o.map((x,i)=>`<div class="opt">${i+1}. ${esc(x.label)}</div>`).join('');break;
   case'matrix':c=`<table><tr><th></th>${o.map(x=>`<th>${esc(x.label)}</th>`).join('')}</tr>${(b.rows||[]).map(r=>`<tr><td>${esc(r.label)}</td>${o.map(()=>'<td>○</td>').join('')}</tr>`).join('')}</table>`;break;
   case'product_rating':c=(b.items||[]).map(i=>`<div class="opt"><b>${esc(i.label)}</b>${media(i.media)}${(b.criteria||[]).map(x=>`<div class="sm">${esc(x.label)} : ★★★☆☆</div>`).join('')}</div>`).join('');break;case'info':c=`<p>${esc(b.text||'')}</p>`;break}
  return `<div class="q">${ans?`<b>${n}. ${esc(b.text||'')}</b>${b.help?`<div class="mu sm">${esc(b.help)}</div>`:''}`:b.kind==='media'?esc(b.text||''):''}${media(b.media)}${c}</div>`};
 const sec=(I)=>I?`<h3>${esc(I.title||'')}</h3><p>${esc(I.text||'')}</p>${media(I.media)}`:'';
 return `<h3>Aperçu du questionnaire</h3><p class="mu sm">Tel que le verra le participant (rendu simplifié).</p><div class="phone">${sec(D.intro)}${D.pages.map(p=>`${p.title?`<h3>${esc(p.title)}</h3>`:''}${p.blocks.map(blk).join('')}<hr>`).join('')}${sec(D.outro)}</div><div class="acts"><button class="btn ghost" data-act="mx">Fermer</button></div>`}

// ================= Onglet 3 : Public visé
const OPL={eq:'est',ne:'n\'est pas',in:'est l\'un de',nin:'n\'est aucun de',gt:'plus de',gte:'au moins',lt:'moins de',lte:'au plus',between:'entre',has:'inclut',has_any:'inclut au moins un de',true:'oui',false:'non'};
const AOPS={number:['gte','lte','gt','lt','eq','between'],cat:['eq','ne','in','nin'],multi:['has','has_any'],bool:['true','false']};
const attrOf=k=>S.meta.attrs.find(a=>a.key===k)||S.meta.attrs[0];
