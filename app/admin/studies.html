<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SunuSound · Études</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--tx:#0f1b22;--mu:#64748b;--bd:#e2e8f0;--pr:#0e9f9a;--ok:#16a34a;--wa:#d97706;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b1116;--card:#151d24;--tx:#e6edf2;--mu:#8da0ad;--bd:#26323b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}header nav{display:flex;gap:4px}
header nav button,header a{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:600;text-decoration:none;font:inherit}
header nav .on{background:var(--pr);color:#fff}
main{padding:16px 20px 80px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px}
input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
button.b{border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--pr);color:#fff;width:auto}
button.b.s{background:var(--bd);color:var(--tx)}button.b.ok{background:var(--ok)}button.b.wa{background:var(--wa)}button.b.er{background:var(--er)}button.b:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.row>label{flex:1 1 160px}.row .grow{flex:2 1 260px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--tx);font-size:13px}label.ck input{width:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu);text-transform:uppercase}
tr.r{cursor:pointer}tr.r:hover td{background:rgba(14,159,154,.06)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;margin:1px 2px;background:var(--bd);color:var(--mu)}
.chip.active,.chip.validated,.chip.granted,.chip.delivered{background:#16a34a22;color:var(--ok)}.chip.paused,.chip.indicative,.chip.pending,.chip.entered{background:#d9770622;color:var(--wa)}
.chip.closed,.chip.rejected,.chip.refused,.chip.revoked{background:#dc262622;color:var(--er)}
.muted{color:var(--mu);font-size:12px}.hidden{display:none!important}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--bd);margin:12px 0}.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:2px solid transparent}.tabs button.on{color:var(--pr);border-bottom-color:var(--pr)}
.page{border:2px solid var(--pr);border-radius:12px;padding:10px;margin:12px 0}.blk{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
.cond{border-top:1px dashed var(--bd);margin-top:8px;padding-top:6px;display:grid;grid-template-columns:140px 1fr;gap:6px;align-items:start}
.toast{position:fixed;right:16px;top:16px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:20;max-width:420px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.asset img{width:100%;height:110px;object-fit:cover;border-radius:8px}.asset .vid{height:110px;display:flex;align-items:center;justify-content:center;background:var(--bd);border-radius:8px}
#login{max-width:360px;margin:12vh auto;padding:0 16px}#login .card{display:flex;flex-direction:column;gap:10px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow:auto;max-height:340px;font-size:12px}
</style></head><body>
<div id="login"><div class="card"><h2 style="margin:0">SunuSound · Études</h2>
<label>URL de l'API<input id="l-api"></label><input id="l-email" type="email" placeholder="E-mail"><input id="l-pass" type="password" placeholder="Mot de passe">
<button class="b" id="l-go">Se connecter</button><div id="l-err" style="color:var(--er)"></div></div></div>

<div id="app" hidden>
<header><h1>SunuSound · Études, sondages, enquêtes commerciales</h1><small id="who"></small>
<nav><button data-tab="studies" class="on">Études</button><button data-tab="sponsors">Initiateurs</button><button data-tab="media">Médiathèque</button></nav>
<a href="index.html">← Mesures</a><a href="surveys.html">Enquêtes</a><button class="b s" id="logout">Déconnexion</button></header>
<main>
<section id="tab-studies"><div class="card"><div class="row"><button class="b" id="st-new">Nouvelle étude</button><div class="grow"></div>
<label>Statut<select id="st-f"><option value="">Tous</option><option value="draft">Brouillon</option><option value="active">Active</option><option value="paused">En pause</option><option value="closed">Clôturée</option></select></label></div></div>
<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Titre</th><th>Initiateur</th><th>Type</th><th>Statut</th><th>Réponses</th><th>Quota</th><th>Clôture</th></tr></thead><tbody id="st-rows"></tbody></table></div>
<div id="editor"></div></section>

<section id="tab-sponsors" hidden><div class="card"><div class="row"><button class="b" id="sp-new">Nouvel initiateur</button></div><div id="sp-form"></div></div>
<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Nom</th><th>Type</th><th>Ville</th><th>Études</th><th>Vérifié</th><th>Actif</th></tr></thead><tbody id="sp-rows"></tbody></table></div></section>

<section id="tab-media" hidden><div class="card"><b>Ajouter une image ou une vidéo</b> <span class="muted">(JPEG, PNG, WebP, GIF · MP4, WebM)</span>
<div class="row" style="margin-top:8px"><label>Fichier<input type="file" id="md-file" accept="image/*,video/mp4,video/webm"></label><label>Nom<input id="md-name"></label><button class="b" id="md-up">Envoyer</button></div></div>
<div class="grid" id="md-grid" style="margin-top:12px"></div></section>
</main></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),4500)};
const fd=s=>s?new Date(s).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'—';
const S={base:localStorage.getItem('ss_api')||'https://soundmaps.rhmanager.site/api/v1',access:sessionStorage.getItem('ss_at'),refresh:sessionStorage.getItem('ss_rt'),me:null,meta:null,sponsors:[],assets:[],studies:[]};
let E=null,refreshing=null;const thumbs={};
const saveTokens=(a,r)=>{S.access=a;S.refresh=r;sessionStorage.setItem('ss_at',a);sessionStorage.setItem('ss_rt',r)};
const logout=()=>{S.access=S.refresh=null;sessionStorage.clear();$('#app').hidden=true;$('#login').hidden=false};
async function refreshTokens(){if(!S.refresh)return false;refreshing||=fetch(S.base+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.refresh})}).then(async r=>{if(!r.ok)return false;const d=await r.json();saveTokens(d.access_token,d.refresh_token);return true}).catch(()=>false).finally(()=>refreshing=null);return refreshing}
async function raw(path,{method='GET',body,query,form}={},retry=true){
 const url=new URL(S.base+path);for(const[k,v]of Object.entries(query||{})){if(Array.isArray(v))v.forEach(x=>url.searchParams.append(k,x));else if(v!==''&&v!=null)url.searchParams.set(k,v)}
 let r;try{r=await fetch(url,{method,headers:{...(body?{'Content-Type':'application/json'}:{}),Authorization:'Bearer '+S.access},body:form||(body?JSON.stringify(body):undefined)})}catch{throw new Error('Serveur injoignable')}
 if(r.status===401&&retry&&await refreshTokens())return raw(path,{method,body,query,form},false);
 if(r.status===401){logout();throw new Error('Session expirée')}return r}

const ERR={invalid_definition:'Définition invalide',no_profiles_for_slot:'Impossible de créer des profils pour cette rubrique : passez-la en « Questions directes » ou décochez « Plusieurs profils »',survey_too_large:'Enquête trop grande',empty_slot:'Rubrique vide',duplicate_indicator:'Même question présente deux fois',indicator_wrong_domain:'Question hors du domaine choisi',sensitive_axis_not_allowed:'Axe sensible non autorisé',kind_mismatch:'Type de question incompatible',survey_not_found:'Enquête introuvable',invalid_credentials:'Identifiants incorrects',insufficient_role:'Droits insuffisants'};
function friendly(d,status){
  const x=d?.detail;
  if(typeof x==='string')return ERR[x]||x;
  if(x&&x.code){let m=ERR[x.code]||x.code;if(x.slot)m+=' ('+x.slot+')';
    if(x.errors&&x.errors.length)m+=' : '+x.errors.map(e=>ERR[String(e).split(':')[0]]||e).join(' ; ');return m}
  return 'Erreur '+status}
async function api(path,o){const r=await raw(path,o);const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(friendly(d,r.status));return d}
async function download(path,query,name){const r=await raw(path,{query});if(!r.ok)throw new Error('Erreur '+r.status);const u=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function loadThumbs(root){for(const img of $$('img[data-asset]',root)){const id=img.dataset.asset;try{thumbs[id]??=URL.createObjectURL(await(await raw('/study-assets/'+id)).blob());img.src=thumbs[id]}catch{}}}

// ---------- auth
$('#l-api').value=S.base;
$('#l-go').onclick=async()=>{$('#l-err').textContent='';S.base=$('#l-api').value.trim().replace(/\/+$/,'');localStorage.setItem('ss_api',S.base);
 try{const r=await fetch(S.base+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#l-email').value.trim(),password:$('#l-pass').value})});const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Erreur '+r.status);saveTokens(d.access_token,d.refresh_token);await start()}catch(e){$('#l-err').textContent=e.message}};
$('#logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST',body:{refresh_token:S.refresh}})}catch{}logout()};
async function start(){S.me=await api('/users/me');if(S.me.role!=='tenant_admin'){logout();throw new Error('Réservé aux administrateurs.')}
 $('#who').textContent=S.me.pseudonym;$('#login').hidden=true;$('#app').hidden=false;S.meta=await api('/study-admin/meta');await Promise.all([loadSponsors(),loadAssets()]);await loadStudies()}
$$('header nav button').forEach(b=>b.onclick=()=>{$$('header nav button').forEach(x=>x.classList.toggle('on',x===b));['studies','sponsors','media'].forEach(t=>$('#tab-'+t).hidden=b.dataset.tab!==t)});

// ---------- médiathèque
async function loadAssets(){S.assets=await api('/study-admin/assets');renderMedia()}
function renderMedia(){$('#md-grid').innerHTML=S.assets.map(a=>`<div class="card asset"><div>${a.kind==='image'?`<img data-asset="${a.id}">`:'<div class="vid">▶ vidéo</div>'}</div><b>${esc(a.name)}</b><div class="muted">${a.kind} · ${Math.round(a.size_bytes/1024)} Ko</div><div class="row"><button class="b s" data-copy="${a.id}">Copier l'ID</button><button class="b er" data-delasset="${a.id}">✕</button></div></div>`).join('')||'<div class="muted">Aucun média.</div>';loadThumbs($('#md-grid'))}
$('#md-up').onclick=async()=>{const f=$('#md-file').files[0];if(!f)return toast('Choisissez un fichier');const form=new FormData();form.append('file',f);if($('#md-name').value)form.append('name',$('#md-name').value);
 try{const r=await raw('/study-admin/assets',{method:'POST',form});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Erreur');toast('Média ajouté');$('#md-file').value='';await loadAssets()}catch(e){toast(e.message)}};
$('#md-grid').onclick=async e=>{const c=e.target.dataset.copy,d=e.target.dataset.delasset;if(c){navigator.clipboard.writeText(c);toast('ID copié : '+c)}
 if(d&&confirm('Supprimer ce média ?')){try{await api('/study-admin/assets/'+d,{method:'DELETE'});loadAssets()}catch(x){toast(x.message==='asset_in_use'?'Média utilisé dans une étude ou un initiateur':x.message)}}};
const assetOpts=(kind,sel)=>'<option value="">—</option>'+S.assets.filter(a=>!kind||a.kind===kind).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');

// ---------- initiateurs
async function loadSponsors(){S.sponsors=await api('/study-admin/sponsors');$('#sp-rows').innerHTML=S.sponsors.map(s=>`<tr class="r" data-sp="${s.id}"><td><b>${esc(s.name)}</b><div class="muted">${esc(s.tagline||'')}</div></td><td>${esc(s.kind)}</td><td>${esc(s.city||'')}</td><td>${s.studies}</td><td>${s.verified?'✓':''}</td><td>${s.active?'✓':'—'}</td></tr>`).join('')||'<tr><td colspan=6 class="muted">Aucun initiateur.</td></tr>'}
$('#sp-rows').onclick=e=>{const tr=e.target.closest('tr[data-sp]');if(tr)spForm(S.sponsors.find(s=>s.id===tr.dataset.sp))};$('#sp-new').onclick=()=>spForm(null);
function spForm(sp){const v=sp||{kind:'company',active:true,activities:[],facts:{}};const i=(id,l,val,t='text')=>`<label>${l}<input id="sp-${id}" type="${t}" value="${esc(val??'')}"></label>`;
 $('#sp-form').innerHTML=`<div class="card"><div class="row"><label>Type<select id="sp-kind">${S.meta.sponsor_kinds.map(k=>`<option value="${k.value}" ${k.value===v.kind?'selected':''}>${esc(k.label)}</option>`).join('')}</select></label>${i('name','Nom *',v.name)}${i('tagline','Accroche',v.tagline)}</div>
 <label style="margin-top:8px">Description<textarea id="sp-description" rows=3>${esc(v.description||'')}</textarea></label>
 <div class="row" style="margin-top:8px">${i('sector','Secteur',v.sector)}${i('city','Ville',v.city)}${i('country','Pays',v.country)}${i('website','Site web',v.website)}${i('contact','Contact public',v.contact_public)}</div>
 <div class="row" style="margin-top:8px"><label>Logo<select id="sp-logo">${assetOpts('image',v.logo_asset_id)}</select></label><label>Couverture<select id="sp-cover">${assetOpts('image',v.cover_asset_id)}</select></label>
 <label>Activités (séparées par des virgules)<input id="sp-act" value="${esc((v.activities||[]).join(', '))}"></label></div>
 <label style="margin-top:8px">Informations de base (une par ligne : clé: valeur)<textarea id="sp-facts" rows=3>${esc(Object.entries(v.facts||{}).map(([k,x])=>k+': '+x).join('\n'))}</textarea></label>
 <div class="row" style="margin-top:8px"><label class="ck"><input type="checkbox" id="sp-verified" ${v.verified?'checked':''}> Vérifié</label><label class="ck"><input type="checkbox" id="sp-active" ${v.active!==false?'checked':''}> Actif</label>
 <button class="b" id="sp-save">Enregistrer</button>${sp?'<button class="b er" id="sp-del">Supprimer</button>':''}</div></div>`;
 $('#sp-save').onclick=async()=>{const facts={};$('#sp-facts').value.split('\n').forEach(l=>{const m=l.match(/^([^:]+):(.*)$/);if(m)facts[m[1].trim()]=m[2].trim()});
 const b={kind:$('#sp-kind').value,name:$('#sp-name').value.trim(),tagline:$('#sp-tagline').value||null,description:$('#sp-description').value||null,sector:$('#sp-sector').value||null,city:$('#sp-city').value||null,country:$('#sp-country').value||null,website:$('#sp-website').value||null,contact_public:$('#sp-contact').value||null,logo_asset_id:$('#sp-logo').value||null,cover_asset_id:$('#sp-cover').value||null,activities:$('#sp-act').value.split(',').map(x=>x.trim()).filter(Boolean),facts,verified:$('#sp-verified').checked,active:$('#sp-active').checked};
 try{await api(sp?'/study-admin/sponsors/'+sp.id:'/study-admin/sponsors',{method:sp?'PATCH':'POST',body:b});toast('Enregistré');$('#sp-form').innerHTML='';loadSponsors()}catch(e){toast(e.message)}};
 if(sp)$('#sp-del').onclick=async()=>{if(!confirm('Supprimer ?'))return;try{await api('/study-admin/sponsors/'+sp.id,{method:'DELETE'});$('#sp-form').innerHTML='';loadSponsors()}catch(e){toast(e.message)}}}

// ---------- liste des études
async function loadStudies(){S.studies=await api('/study-admin/studies',{query:{status:$('#st-f').value}});
 $('#st-rows').innerHTML=S.studies.map(s=>`<tr class="r" data-st="${s.id}"><td><b>${esc(s.title)}</b></td><td>${esc(s.sponsor_name)}</td><td>${esc(s.kind_label)}</td><td><span class="chip ${s.status}">${s.status}</span></td><td>${s.responses}</td><td>${s.quota_total||'∞'}</td><td>${fd(s.ends_at)}</td></tr>`).join('')||'<tr><td colspan=7 class="muted">Aucune étude.</td></tr>'}
$('#st-f').onchange=loadStudies;
$('#st-rows').onclick=async e=>{const tr=e.target.closest('tr[data-st]');if(!tr)return;try{E=await api('/study-admin/studies/'+tr.dataset.st);E._tab='gen';renderEditor()}catch(x){toast(x.message)}};
$('#st-new').onclick=()=>{if(!S.sponsors.length)return toast("Créez d'abord un initiateur");E=newStudy();renderEditor()};
// ======================= ÉDITEUR D'ÉTUDE (suite) =======================
const clone=o=>JSON.parse(JSON.stringify(o));
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setP=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};
const merge=(d,s)=>{if(s==null)return clone(d);const o={...d};for(const k of Object.keys(s)){const a=d[k],b=s[k];o[k]=(a&&typeof a==='object'&&!Array.isArray(a)&&b&&typeof b==='object'&&!Array.isArray(b))?merge(a,b):b}return o};
const pval=s=>{s=String(s).trim();if(s==='true')return true;if(s==='false')return false;if(s!==''&&!isNaN(s))return Number(s);return s};
const toLoc=iso=>{if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const mv=(a,i,dl)=>{const j=i+dl;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};

const ANSW=new Set(['single_choice','multi_choice','yes_no','number','slider','scale','stars','nps','text','long_text','ranking','matrix','date','product_rating']);
const SCR=new Set(['single_choice','multi_choice','yes_no','number','slider','scale','stars','nps']);
const ATT=new Set(['single_choice','yes_no','number','scale','stars','nps']);
const OPL={eq:'=',ne:'≠',in:'parmi',nin:'pas parmi',gt:'>',gte:'≥',lt:'<',lte:'≤',between:'entre',has:'contient',has_any:'contient un de',true:'oui',false:'non',answered:'est répondu',not_answered:'non répondu'};
const COPS=['eq','ne','in','nin','gt','gte','lt','lte','answered','not_answered','has','has_any'];
const AOPS={number:['eq','ne','gt','gte','lt','lte','between'],cat:['eq','ne','in','nin'],multi:['has','has_any'],bool:['true','false']};
const LISTOPS=['in','nin','has_any'];

const DEF_T={include:[],exclude:[],geo:null,strict_unknown:false,min_reliability:0,sampling:{mode:'open',oversample:null,max_invites:null}};
const DEF_R={enabled:false,kind:'points',mode:'guaranteed',label:'',description:'',amount:0,unit:'',winners:0,validation:'auto',budget_total:null,max_rewarded:null,
 conditions:{min_status:'validated',min_score:0.7,require_attention:true,min_account_age_days:0,min_reliability:0,auto_grant_score:0.8},
 forfeit:{claim_deadline_days:null,revoke_on_admin_reject:true,revoke_on_fraud:true,notes:''},
 delivery:{requires_contact:false,contact_label:'Numéro Wave / Orange Money',instructions:'',valid_until:null}};
const DEF_P={share_profile:[],collect_contact:false,contact_purpose:''};
const OPT2=[{value:'a',label:'Option A'},{value:'b',label:'Option B'}];
const DEFB={single_choice:{options:OPT2},multi_choice:{options:OPT2},ranking:{options:[...OPT2,{value:'c',label:'Option C'}]},
 matrix:{options:[{value:'1',label:'Pas d\'accord'},{value:'2',label:'Neutre'},{value:'3',label:'D\'accord'}],rows:[{value:'r1',label:'Ligne 1'}]},
 product_rating:{items:[{key:'p1',label:'Produit 1'}],criteria:[{value:'overall',label:'Note globale'}],min:1,max:5},
 scale:{min:1,max:5},stars:{max:5},slider:{min:0,max:100,step:1}};

const newStudy=()=>({_tab:'gen',sponsor_id:S.sponsors[0].id,kind:'survey',title:'',summary:null,description:null,terms:null,cover_asset_id:null,starts_at:null,ends_at:null,
 quota_total:0,estimated_minutes:5,tags:[],status:'draft',targeting:clone(DEF_T),reward:clone(DEF_R),privacy:clone(DEF_P),
 definition:{intro:null,outro:null,pages:[{key:'p1',title:'',blocks:[]}],show_progress:true,allow_back:true}});

function norm(){
 if(E._n)return;
 E.targeting=merge(DEF_T,E.targeting);E.reward=merge(DEF_R,E.reward);E.privacy=merge(DEF_P,E.privacy);E.tags=E.tags||[];
 const d=E.definition=E.definition||{pages:[]};d.pages=(d.pages||[]).map(p=>({...p,blocks:p.blocks||[]}));
 if(d.show_progress==null)d.show_progress=true;if(d.allow_back==null)d.allow_back=true;
 if(!E.id&&d.pages[0]&&!d.pages[0].blocks.length)d.pages[0].blocks.push(newBlock('single_choice'));
 E._n=1}

const answKeys=()=>E.definition.pages.flatMap(p=>p.blocks).filter(b=>ANSW.has(b.kind)).map(b=>({key:b.key,text:b.text||''}));

function fmt(v,t){switch(t){
 case'csv':return(v||[]).join(', ');
 case'dt':return toLoc(v);
 case'opts':return(v||[]).map(o=>[o.value,o.label,o.exclusive?'excl':'',o.other?'other':''].filter((x,i)=>i<2||x).join(' | ')).join('\n');
 case'items':return(v||[]).map(i=>[i.key,i.label,i.description||''].filter((x,j)=>j<2||x).join(' | ')).join('\n');
 case'media':return(v||[]).map(m=>(m.asset_id||m.url)+(m.caption?' | '+m.caption:'')).join('\n');
 default:return v==null?'':v}}
const fmtScr=a=>(a||[]).map(x=>Array.isArray(x)?x[0]+'-'+x[1]:x).join(', ');
function parse(t,raw,el,p){switch(t){
 case'n':return raw===''?null:Number(raw);
 case'n0':return raw===''?0:Number(raw);
 case'i':return raw===''?null:Math.round(Number(raw));
 case'i0':return raw===''?0:Math.round(Number(raw));
 case's':return raw.trim()===''?null:raw;
 case'S':return raw;
 case'b':return el.checked;
 case'csv':return raw.split(',').map(x=>x.trim()).filter(Boolean);
 case'dt':return raw?new Date(raw).toISOString():null;
 case'val':return pval(raw);
 case'opts':{const old=getP(E,p)||[];return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const a=l.split('|').map(x=>x.trim());
   const v=(a[0]||'').toLowerCase().replace(/[^a-z0-9_\-]/g,'_');const o={value:v,label:a[1]||a[0]};if(a.includes('excl'))o.exclusive=true;if(a.includes('other'))o.other=true;
   const m=old.find(x=>x.value===v&&x.media);if(m)o.media=m.media;return o})}
 case'items':{const old=getP(E,p)||[];return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const a=l.split('|').map(x=>x.trim());
   const k=(a[0]||'').toLowerCase().replace(/[^a-z0-9_\-]/g,'_');const o={key:k,label:a[1]||a[0]};if(a[2])o.description=a[2];const m=old.find(x=>x.key===k&&x.media);o.media=m?m.media:[];return o})}
 case'media':return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const a=l.split('|').map(x=>x.trim());const id=a[0];let m;
   if(/^https:\/\//.test(id))m={url:id,kind:/\.(mp4|webm)(\?|$)/i.test(id)?'video':'image'};else{const as=S.assets.find(x=>x.id===id);m={asset_id:id,kind:as?as.kind:'image'}}
   if(a[1])m.caption=a[1];return m});
 case'scr':{const k=el.dataset.k;return raw.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{
   if(k==='number'||k==='slider'){const m=x.match(/^(-?[\d.]+)\s*-\s*(-?[\d.]+)$/);return m?[+m[1],+m[2]]:[+x,+x]}return pval(x)})}
 case'cval':{const c=getP(E,p.replace(/\.value$/,''));if(LISTOPS.includes(c.op))return raw.split(',').map(x=>x.trim()).filter(x=>x!=='').map(pval);return raw.trim()===''?null:pval(raw)}
 case'crit':{const c=getP(E,p.replace(/\.value$/,''));const k=attrOf(c.attr).kind;if(raw.trim()==='')return null;
   if(k==='number'){if(c.op==='between'){const m=raw.split(/\s*[-;,]\s*/);return[+m[0],+m[1]]}return Number(raw)}
   if(LISTOPS.includes(c.op))return raw.split(',').map(x=>x.trim()).filter(Boolean);return raw}
 default:return raw}}

const UNITS=[['household','Ménage'],['person','Personne'],['dwelling','Logement'],['enterprise','Entreprise'],['farm','Exploitation'],['facility','Établissement'],['community','Communauté']];
const UNIT_BY_DOMAIN={entreprises:'enterprise',agriculture:'farm'};
const EVID=[['none','Sans photo'],['optional','Photo facultative'],['required','Photo obligatoire']];
const KIND_LBL={number:'Nombre',share:'Oui / Non',scale:'Note sur 5',category:'Choix'};
let B=null;

function indMap(){const m={};S.catalog.domains.forEach(d=>d.indicators.forEach(i=>m[i.key]={...i,domain:d.key}));return m}
function kindOf(i){return i.kind==='number'?'number':i.kind==='share'?'yes_no':i.kind==='scale'?'scale':(i.multi?'multi_choice':'single_choice')}
function newSlot(slots){let n=slots.length+1;const used=new Set(slots.map(x=>x.key));while(used.has('rubrique_'+n))n++;
  return {key:'rubrique_'+n,label:'Rubrique '+n,help:null,multi:false,allow_none:true,mode:'profile'}}
function mkQ(ind,sl){const q={key:ind.key,slot:sl.key,text:ind.label,kind:kindOf(ind),indicator:ind.key,required:true,evidence:'none'};
  if(ind.kind==='category'&&sl.mode==='profile')q.axis=ind.key;return q}
function builderFrom(def){
  const slots=(def?.slots||[]).map(x=>({key:x.key,label:x.label,help:x.help||null,multi:!!x.multi,allow_none:x.allow_none!==false,mode:x.mode||'profile'}));
  const qs={};(def?.questions||[]).forEach(q=>{qs[q.indicator]=q});
  if(!slots.length)slots.push(newSlot(slots));
  return {unit:def?.unit||'household',slots,qs,rules:def?.rules||[],domain:null};
}
function listFor(){
  const im=indMap(),dom=S.catalog.domains.find(d=>d.key===B.domain);
  const list=[...dom.indicators];
  if(B.domain!=='demographie'&&im.household_persons)list.unshift(im.household_persons);
  Object.keys(B.qs).forEach(k=>{if(!list.some(i=>i.key===k)&&im[k])list.push(im[k])});
  return list;
}
function builderToDef(){
  if(!B.slots.length)throw new Error('Ajoutez au moins une rubrique');
  const questions=[];
  for(const sl of B.slots){
    if((sl.label||'').trim().length<2)throw new Error('Donnez un nom à chaque rubrique');
    const qs=Object.values(B.qs).filter(q=>q.slot===sl.key);
    if(!qs.length)throw new Error('La rubrique « '+sl.label+' » est vide : cochez au moins une question ou supprimez-la');
    qs.forEach(q=>{
      if((q.text||'').trim().length<3)throw new Error('Une question n\'a pas de texte (3 caractères min.)');
      questions.push({...q,text:q.text.trim(),evidence:q.evidence||'none'});
    });
  }
  const dims=[...new Set(questions.map(q=>q.axis).filter(Boolean))];
  return {unit:B.unit,
    slots:B.slots.map(x=>({key:x.key,label:x.label.trim(),help:x.help||null,multi:!!x.multi,allow_none:x.allow_none!==false,mode:x.mode})),
    questions,rules:B.rules||[],dimensions:dims};
}

function renderBuilder(){
  const list=listFor();
  $('#bd').innerHTML=B.slots.map((sl,si)=>{
    const n=Object.values(B.qs).filter(q=>q.slot===sl.key).length;
    const rows=list.map(i=>{
      const q=B.qs[i.key],mine=q&&q.slot===sl.key,other=q&&q.slot!==sl.key;

          <label class="ck"><input type="checkbox" data-q="${esc(i.key)}" data-k="required" ${q.required!==false?'checked':''}> Obligatoire</label>
          <select data-q="${esc(i.key)}" data-k="evidence">${EVID.map(([v,l])=>`<option value="${v}" ${(q.evidence||'none')===v?'selected':''}>${l}</option>`).join('')}</select>`
        :other?`<span class="muted">déjà dans « ${esc(where)} »</span><span></span><span></span>`
        :`<span class="muted">${KIND_LBL[i.kind]||i.kind}</span><span></span><span></span>`}
      </div>`}).join('');
    return `<div class="slot">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div class="row" style="flex:1;align-items:end">
          <label class="grow">Nom de la rubrique<input data-sl="${si}" data-k="label" value="${esc(sl.label)}" maxlength="100"></label>
          <label>Comment répond-on ?<select data-sl="${si}" data-k="mode">
            <option value="profile" ${sl.mode==='profile'?'selected':''}>Choisir un profil (rapide)</option>
            <option value="direct" ${sl.mode==='direct'?'selected':''}>Répondre question par question</option></select></label>
          ${sl.mode==='profile'?`<label class="ck"><input type="checkbox" data-sl="${si}" data-k="multi" ${sl.multi?'checked':''}> Plusieurs profils possibles</label>`:''}
        </div>
        <span><button class="b s" data-act="up" data-si="${si}">↑</button> <button class="b s" data-act="down" data-si="${si}">↓</button> <button class="b er" data-act="del-slot" data-si="${si}">✕</button></span>
      </div>
      <div class="muted" style="margin:8px 0 4px">${n} question(s) · <a href="#" data-act="all" data-si="${si}">tout sélectionner</a> · <a href="#" data-act="none" data-si="${si}">tout décocher</a></div>
      ${rows}
    </div>`}).join('')+`<button class="b s" data-act="add-slot">+ Ajouter une rubrique</button>`;
}

function wireBuilder(){
  const bd=$('#bd');
  bd.addEventListener('input',e=>{const el=e.target,d=el.dataset;
    if(d.sl!=null&&d.k==='label')B.slots[+d.sl].label=el.value;
    else if(d.q&&d.k==='text'&&B.qs[d.q])B.qs[d.q].text=el.value});
  bd.addEventListener('change',e=>{const el=e.target,d=el.dataset,im=indMap();
    if(d.pick!=null){const sl=B.slots[+d.pick],ind=im[d.ind];
      if(el.checked)B.qs[ind.key]=B.qs[ind.key]?{...B.qs[ind.key],slot:sl.key}:mkQ(ind,sl);else delete B.qs[ind.key];
      renderBuilder()}
    else if(d.sl!=null&&d.k==='mode'){const sl=B.slots[+d.sl];sl.mode=el.value;
      if(sl.mode==='profile')Object.values(B.qs).forEach(q=>{if(q.slot===sl.key&&im[q.indicator]?.kind==='category'&&!q.axis)q.axis=q.indicator});
      renderBuilder()}
    else if(d.sl!=null&&d.k==='multi')B.slots[+d.sl].multi=el.checked;
    else if(d.q&&d.k==='required'&&B.qs[d.q])B.qs[d.q].required=el.checked;
    else if(d.q&&d.k==='evidence'&&B.qs[d.q])B.qs[d.q].evidence=el.value});
  bd.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();
    const d=b.dataset,si=+d.si,im=indMap();
    switch(d.act){
      case'add-slot':B.slots.push(newSlot(B.slots));break;
      case'del-slot':{const sl=B.slots[si];const n=Object.values(B.qs).filter(q=>q.slot===sl.key).length;
        if(n&&!confirm('Supprimer cette rubrique et ses '+n+' question(s) ?'))return;
        Object.keys(B.qs).forEach(k=>{if(B.qs[k].slot===sl.key)delete B.qs[k]});B.slots.splice(si,1);
        if(!B.slots.length)B.slots.push(newSlot(B.slots));break}
      case'up':if(si>0)[B.slots[si-1],B.slots[si]]=[B.slots[si],B.slots[si-1]];break;
      case'down':if(si<B.slots.length-1)[B.slots[si+1],B.slots[si]]=[B.slots[si],B.slots[si+1]];break;
      case'all':{const sl=B.slots[si];listFor().forEach(i=>{if(!B.qs[i.key])B.qs[i.key]=mkQ(i,sl)});break}
      case'none':{const sl=B.slots[si];Object.keys(B.qs).forEach(k=>{if(B.qs[k].slot===sl.key)delete B.qs[k]});break}
    }
    renderBuilder()});
}

async function loadRes(){const R=E._res;R.by=$('#res-by').value;R.st=$$('#res-st input:checked').map(i=>i.value);
 const r=await api(`/study-admin/studies/${E.id}/results`,{query:{by:R.by,status:R.st}});$('#res-out').innerHTML=resHtml(r)}
const bars=(cs,tot)=>cs.map(c=>`<div class="row" style="align-items:center;flex-wrap:nowrap;margin:3px 0"><span style="width:220px">${esc(c.label)}</span><div class="bar" style="flex:1"><i style="width:${tot?c.n/tot*100:0}%"></i></div><span class="muted" style="width:96px;text-align:right">${c.n} · ${tot?Math.round(c.n/tot*100):0} %</span></div>`).join('');
function grp(q){const gs=Object.entries(q.groups||{});if(!gs.length)return'';
 if(q.counts)return `<table style="margin-top:8px"><thead><tr><th></th>${gs.map(([g])=>`<th>${esc(g)}</th>`).join('')}</tr></thead><tbody>${q.counts.map((c,i)=>`<tr><td>${esc(c.label)}</td>${gs.map(([,v])=>{const n=v.counts?.[i]?.n??0,t=q.kind==='multi_choice'?v.n:(v.counts||[]).reduce((a,x)=>a+x.n,0);return `<td>${n} · ${t?Math.round(n/t*100):0} %</td>`}).join('')}</tr>`).join('')}</tbody></table>`;
 return `<table style="margin-top:8px"><thead><tr><th>Groupe</th><th>n</th><th>Moyenne</th></tr></thead><tbody>${gs.map(([g,v])=>`<tr><td>${esc(g)}</td><td>${v.n}</td><td>${v.mean??'—'}</td></tr>`).join('')}</tbody></table>`}
function resHtml(r){
 return `<div class="card"><b>${r.n} réponse(s)</b>${r.by?' · '+Object.entries(r.groups).map(([g,n])=>`<span class="chip">${esc(g)} ${n}</span>`).join(''):''}</div>`+r.questions.map(q=>{let b='';
  if(q.counts){const tot=q.kind==='multi_choice'?q.n:q.counts.reduce((a,c)=>a+c.n,0);b=bars(q.counts,tot);
   if(q.mean!=null)b+=`<div class="muted">Moyenne <b>${q.mean}</b>${q.nps!=null?` · NPS <b>${q.nps}</b> (promoteurs ${q.promoters}, détracteurs ${q.detractors})`:''}</div>`;b+=grp(q)}
  else if(q.hist){const mx=Math.max(1,...q.hist);b=`<div class="muted">moy. <b>${q.mean}</b> · méd. ${q.median} · min ${q.min} · max ${q.max} · Q1 ${q.p25} · Q3 ${q.p75}</div><div style="display:flex;gap:3px;align-items:end;height:60px;margin-top:6px">${q.hist.map(h=>`<i style="flex:1;background:var(--pr);height:${h/mx*100}%;border-radius:3px" title="${h}"></i>`).join('')}</div>${grp(q)}`}
  else if(q.texts)b=`<ul style="margin:6px 0 0 16px">${q.texts.map(t=>`<li>${esc(t)}</li>`).join('')||'<li class="muted">Aucune</li>'}</ul>`;
  else if(q.ranking)b=`<table><thead><tr><th>Option</th><th>Rang moyen</th><th>1ers choix</th><th>n</th></tr></thead><tbody>${q.ranking.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.avg_rank??'—'}</td><td>${x.first}</td><td>${x.n}</td></tr>`).join('')}</tbody></table>`;
  else if(q.rows)b=q.rows.map(r=>`<div style="margin-top:6px"><b>${esc(r.row)}</b>${bars(r.counts,r.counts.reduce((a,c)=>a+c.n,0))}</div>`).join('');
  else if(q.items)b=q.items.map(i=>`<div style="margin-top:8px"><b>${esc(i.item)}</b>${i.criteria.map(c=>`<div class="muted">${esc(c.criterion)} : moy. <b>${c.mean??'—'}</b> (n=${c.n}) · répartition ${c.counts.join(' / ')}</div>`).join('')}${i.comments.length?`<ul style="margin:4px 0 0 16px">${i.comments.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div>`).join('');
  return `<div class="card"><b>${esc(q.text||q.key)}</b> <span class="muted">${q.kind} · n=${q.n}</span>${b}</div>`}).join('')}

 <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Récompense</th><th>Participant</th><th>Statut</th><th>Score</th><th>Motif</th><th>Contact</th><th>Actions</th></tr></thead><tbody>${d.items.map(r=>`<tr><td><b>${esc(r.headline)}</b>${r.code?'<div class="muted">code : '+esc(r.code)+'</div>':''}</td><td class="muted">${esc(r.participant)}</td><td><span class="chip ${r.status}">${esc(r.status_label)}</span></td><td>${r.score==null?'—':Math.round(r.score*100)+' %'}</td><td class="muted">${esc(r.reason_label||'')}</td><td class="muted">${esc(r.phone||'')} ${esc(r.name||'')}${r.reference?'<div>réf '+esc(r.reference)+'</div>':''}</td>
  <td style="white-space:nowrap">${['pending','entered','refused'].includes(r.status)?`<button class="b ok" data-act="rw-act" data-a="approve" data-id="${r.id}">Accorder</button> `:''}${['pending','entered'].includes(r.status)?`<button class="b er" data-act="rw-act" data-a="refuse" data-id="${r.id}">Refuser</button> `:''}${r.status==='granted'?`<button class="b" data-act="rw-act" data-a="deliver" data-id="${r.id}">Remis</button> `:''}${['granted','delivered'].includes(r.status)?`<button class="b wa" data-act="rw-act" data-a="revoke" data-id="${r.id}">Retirer</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Aucune.</td></tr>'}</tbody></table></div>
 <div class="card"><b>Codes de bons</b> <span class="muted">(${d.codes_free} libre(s))</span><textarea id="rw-codes" rows="3" placeholder="Un code par ligne" style="width:100%;margin-top:6px"></textarea><button class="b" data-act="codes" style="margin-top:6px">Ajouter les codes</button></div>
 ${lot?`<div class="card"><b>Tirage au sort</b><div class="row">${'<label>Gagnants<input id="dr-n" type="number" min="1"></label><label>Graine (optionnel)<input id="dr-seed" type="number"></label>'}<button class="b" data-act="draw">Lancer le tirage</button></div></div>`:''}`}

// ---------- sauvegarde
function payload(){const r=clone(E.reward);if(!r.unit)r.unit=null;if(!r.label)r.label=null;
 return {sponsor_id:E.sponsor_id,kind:E.kind,title:E.title,summary:E.summary,description:E.description,cover_asset_id:E.cover_asset_id,starts_at:E.starts_at,ends_at:E.ends_at,quota_total:E.quota_total||0,estimated_minutes:E.estimated_minutes||5,terms:E.terms,tags:E.tags||[],targeting:clone(E.targeting),reward:r,privacy:clone(E.privacy),definition:clone(E.definition)}}
async function reload(id){const tab=E._tab;E=await api('/study-admin/studies/'+(id||E.id));E._tab=tab;renderEditor();loadStudies()}
async function save(){const b=payload();
 if(E.id){const r=await api('/study-admin/studies/'+E.id,{method:'PATCH',body:b});toast(r.version_bumped?'Enregistré (nouvelle version du questionnaire)':'Enregistré');await reload()}
 else{const r=await api('/study-admin/studies',{method:'POST',body:b});toast('Étude créée');await reload(r.id)}}

// ---------- événements
function onMisc(e){const el=e.target;if(!el.classList)return;
 if(el.dataset.addmedia&&el.value){const a=S.assets.find(x=>x.id===el.value),arr=getP(E,el.dataset.addmedia)||[];arr.push({asset_id:a.id,kind:a.kind});setP(E,el.dataset.addmedia,arr);renderTab();return}
 if(el.classList.contains('rsel')){const R=E._rs;el.checked?R.sel.add(el.dataset.id):R.sel.delete(el.dataset.id);$('#rs-sel').textContent=R.sel.size+' sélectionnée(s)'}
 if(el.id==='rs-all'){const R=E._rs;R.items.forEach(r=>el.checked?R.sel.add(r.id):R.sel.delete(r.id));$$('.rsel').forEach(c=>c.checked=el.checked);$('#rs-sel').textContent=R.sel.size+' sélectionnée(s)'}}
function onEdit(e){const el=e.target,p=el.dataset&&el.dataset.p;if(!p)return;const t=el.dataset.t;
 if(e.type==='input'&&(el.tagName==='SELECT'||el.type==='checkbox'))return;
 if(t==='chk'){if(e.type!=='change')return;const a=getP(E,p)||[],i=a.indexOf(el.dataset.v);if(el.checked){if(i<0)a.push(el.dataset.v)}else if(i>=0)a.splice(i,1);setP(E,p,a);return}
 if(t==='attr'){if(e.type!=='change')return;const c=getP(E,p);c.attr=el.value;c.op=AOPS[attrOf(c.attr).kind][0];c.value=null;renderTab();return}
 if(t==='op'){if(e.type!=='change')return;const c=getP(E,p);c.op=el.value;c.value=null;renderTab();return}
 if(t==='kind'){if(e.type!=='change')return;setKind(getP(E,p),el.value);renderTab();return}
 setP(E,p,parse(t,el.value,el,p));
 if(e.type==='change'&&el.dataset.r)renderTab()}
async function onClick(e){const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,d=a.dataset,D=E.definition;
 switch(act){
 case'tab':E._tab=d.v;renderEditor();break;
 case'save':await save();break;
 case'close':E=null;$('#editor').innerHTML='';break;
 case'status':{await save();const r=await api(`/study-admin/studies/${E.id}/status`,{method:'POST',body:{status:d.v}});toast('Statut : '+d.v+(r.warnings&&r.warnings.length?' — '+r.warnings.join(' | '):''));await reload();break}
 case'invite':{const r=await api(`/study-admin/studies/${E.id}/invite`,{method:'POST'});toast(`${r.invited} invitation(s) envoyée(s)`);break}
 case'dup':{const n=await api(`/study-admin/studies/${E.id}/duplicate`,{method:'POST'});E._tab='gen';await reload(n.id);toast('Copie créée');break}
 case'del':if(confirm('Supprimer cette étude (brouillon sans réponse) ?')){await api('/study-admin/studies/'+E.id,{method:'DELETE'});E=null;$('#editor').innerHTML='';loadStudies()}break;
 // questionnaire
 case'raw':E._raw=true;renderTab();break;
 case'raw-cancel':E._raw=false;renderTab();break;
 case'raw-apply':try{E.definition=JSON.parse($('#rawdef').value);E._raw=false;renderTab()}catch{toast('JSON invalide')}break;
 case'intro-add':D[d.v]={title:'',text:'',media:[]};renderTab();break;
 case'intro-del':D[d.v]=null;renderTab();break;
 case'p-add':D.pages.push({key:nk('p'),title:'',blocks:[newBlock('single_choice')]});renderTab();break;
 case'p-del':if(D.pages.length>1&&confirm('Supprimer cette page ?')){D.pages.splice(+d.i,1);renderTab()}break;
 case'p-up':case'p-dn':mv(D.pages,+d.i,act==='p-up'?-1:1);renderTab();break;
 case'b-add':D.pages[+d.pi].blocks.push(newBlock($('#addk-'+d.pi).value));renderTab();break;
 case'b-del':D.pages[+d.pi].blocks.splice(+d.bi,1);renderTab();break;
 case'b-up':case'b-dn':mv(D.pages[+d.pi].blocks,+d.bi,act==='b-up'?-1:1);renderTab();break;
 case'cond-add':{const ks=answKeys();if(!ks.length)return toast('Ajoutez d\'abord une question');setP(E,d.p,{mode:'all',rules:[{q:ks[0].key,op:'eq',value:null}]});renderTab();break}
 case'cond-clear':setP(E,d.p,undefined);renderTab();break;
 case'rule-add':{const ks=answKeys();getP(E,d.p).rules.push({q:ks[0]?.key||'',op:'eq',value:null});renderTab();break}
 case'rule-del':{const c=getP(E,d.p);c.rules.splice(+d.i,1);if(!c.rules.length)setP(E,d.p,undefined);renderTab();break}
 case'scr-add':setP(E,d.p+'.screen',{allow:[],deny:[],message:null});renderTab();break;
 case'scr-del':setP(E,d.p+'.screen',undefined);renderTab();break;
 case'att-add':setP(E,d.p+'.attention',{correct:null});renderTab();break;
 case'att-del':setP(E,d.p+'.attention',undefined);renderTab();break;
 // ciblage
 case'crit-add':getP(E,d.p).push({attr:S.meta.attrs[0].key,op:AOPS[S.meta.attrs[0].kind][0],value:null,mode:'must',weight:1});renderTab();break;
 case'crit-del':getP(E,d.p).splice(+d.i,1);renderTab();break;
 case'geo-on':E.targeting.geo={circles:[],cities:[],h3_res:null,h3_cells:[],mode:'must'};renderTab();break;
 case'geo-off':E.targeting.geo=null;renderTab();break;
 case'circ-add':E.targeting.geo.circles.push({lat:14.6937,lon:-17.4441,radius_km:10,label:''});renderTab();break;
 case'circ-del':E.targeting.geo.circles.splice(+d.i,1);renderTab();break;
 case'preview':{const r=await api('/study-admin/targeting/preview',{method:'POST',body:{targeting:E.targeting}});
  const ch=o=>Object.entries(o||{}).map(([k,v])=>`<span class="chip">${esc(k)} ${v}</span>`).join('')||'—';
  $('#tg-prev').innerHTML=`<div class="card"><div class="row" style="gap:24px"><div class="kv">Utilisateurs<b>${r.users_total}</b></div><div class="kv">Ayant consenti<b>${r.users_consented}</b></div><div class="kv">Cible éligible<b>${r.eligible}</b></div><div class="kv">Réponses attendues<b>${r.expected_responses}</b></div></div>
   <div style="margin-top:8px"><b>Genre</b> ${ch(r.by_gender)}</div><div><b>Âge</b> ${ch(r.by_age)}</div><div><b>Villes</b> ${ch(r.by_city)}</div><div><b>Données manquantes</b> ${ch(r.unknown_by_attribute)}</div><div class="muted" style="margin-top:6px">${esc(r.note)}</div></div>`;break}
 // résultats / réponses / récompenses
 case'res-go':await loadRes();break;
 case'export':await download(`/study-admin/studies/${E.id}/export`,{fmt:d.v,status:$$('#res-st input:checked').map(i=>i.value)},`etude-${E.id.slice(0,8)}.${d.v}`);break;
 case'resp-go':E._rs.off=0;await loadResp();break;
 case'resp-prev':E._rs.off=Math.max(0,E._rs.off-E._rs.lim);await loadResp();break;
 case'resp-next':if(E._rs.off+E._rs.lim<E._rs.total){E._rs.off+=E._rs.lim;await loadResp()}break;
 case'decide':{const R=E._rs,reason=$('#dc-reason').value.trim();if(!R.sel.size)return toast('Aucune sélection');if(reason.length<3)return toast('Motif requis (3 car. min.)');
  const r=await api(`/study-admin/studies/${E.id}/responses/decide`,{method:'POST',body:{ids:[...R.sel],status:$('#dc-st').value,reason}});toast(`${r.updated} mise(s) à jour`);await loadResp();break}
 case'rw-f':E._rw.st=$('#rw-f').value;renderTab();break;
 case'rw-act':{const body={action:d.a,reason_code:['refuse','revoke'].includes(d.a)?$('#rw-reason').value:null,note:$('#rw-note').value||null,reference:d.a==='deliver'?($('#rw-ref').value||null):null};
  await api('/study-admin/rewards/'+d.id+'/action',{method:'POST',body});toast('OK');renderTab();break}
 case'codes':{const codes=$('#rw-codes').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!codes.length)return toast('Aucun code');
  const r=await api(`/study-admin/studies/${E.id}/codes`,{method:'POST',body:{codes}});toast(`${r.added} ajouté(s), ${r.assigned_to_waiting} attribué(s)`);renderTab();break}
 case'draw':{if(!confirm('Lancer le tirage ? Action définitive.'))return;const n=$('#dr-n').value,s=$('#dr-seed').value;
  const r=await api(`/study-admin/studies/${E.id}/draw`,{method:'POST',body:{winners:n?+n:null,seed:s?+s:null}});toast(`${r.winners} gagnant(s) sur ${r.entries} (graine ${r.seed})`);await reload();break}
 }}
$('#editor').addEventListener('input',onEdit);
$('#editor').addEventListener('change',e=>{onMisc(e);onEdit(e)});
$('#editor').addEventListener('click',e=>onClick(e).catch(x=>toast(x.message)));
if(S.access)start().catch(()=>logout());
</script>
</body></html>
