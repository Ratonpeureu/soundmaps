<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SunuSound · Enquêtes</title><link rel="stylesheet" href="admin.css"></head><body>
<script src="admin.js"></script>
<script>
boot({page:'surveys',roles:['tenant_admin','analyst'],ready:init});
const S={cat:null,surveys:[],resp:{items:[],total:0,off:0},sel:new Set()};let E=null;const IND={};
const isAdmin=()=>A.me.role==='tenant_admin';
const UNITS=[['household','Ménage'],['person','Personne'],['dwelling','Logement'],['enterprise','Entreprise'],['farm','Exploitation agricole'],['facility','Établissement (école, centre de santé…)'],['community','Communauté / quartier']];
const STL={draft:'Brouillon',active:'Active',paused:'En pause',closed:'Fermée'};
const QSL={pending:'En évaluation',validated:'Validée',indicative:'Indicative',rejected:'Rejetée'};
const MODE={profile:'Profil',mixed:'Mixte',direct:'Direct'};const ORG={deterministic:'Automatique',cluster:'Réponses réelles',ai:'IA',admin:'Admin'};
const toLoc=iso=>{if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
async function init(){S.cat=await api('/datamap/catalog');S.cat.domains.forEach(d=>d.indicators.forEach(i=>IND[i.key]=i));
 $('#main').innerHTML=`<div id="v-list"></div><div id="v-edit" hidden></div>`;list()}
// ================= liste + onglets
function list(){E=null;$('#v-edit').hidden=true;const v=$('#v-list');v.hidden=false;
 v.innerHTML=`<h2>Enquêtes</h2><div class="sub">Cartographie participative de la société : choisissez des thèmes, la plateforme gère le reste.</div>
 <div class="tabs">${[['sv','Mes enquêtes'],['rs','Réponses à vérifier'],['rd','Répondants'],['rf','Valeurs de référence'],['ct','Catalogue']].map(([k,l],i)=>`<button class="${i?'':'on'}" data-t="${k}">${l}</button>`).join('')}</div><div id="tab"></div>`;
 $$('.tabs button',v).forEach(b=>b.onclick=()=>{$$('.tabs button',v).forEach(x=>x.classList.toggle('on',x===b));({sv:tSv,rs:tRs,rd:tRd,rf:tRf,ct:tCt})[b.dataset.t]()});tSv()}
async function tSv(){const el=$('#tab');el.innerHTML='<div class="empty">Chargement…</div>';
 try{S.surveys=await api('/survey-admin/surveys')}catch(e){return toast(e.message,1)}
 const n=k=>S.surveys.filter(s=>s.status===k).length;
 el.innerHTML=`<div class="kpis">${kpi('Enquêtes',S.surveys.length)}${kpi('Actives',n('active'))}${kpi('Réponses',S.surveys.reduce((a,s)=>a+s.responses,0))}</div>
 <div class="row" style="margin:14px 0">${isAdmin()?'<button class="btn" id="new">＋ Nouvelle enquête</button>':''}<div class="sp"></div><select id="fs" style="width:auto"><option value="">Tous les statuts</option>${Object.entries(STL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
 <div class="g3" id="cards"></div>`;
 const draw=()=>{const f=$('#fs').value;$('#cards').innerHTML=S.surveys.filter(s=>!f||s.status===f).map(s=>{const d=S.cat.domains.find(x=>x.key===s.domain);return `<div class="card hov" data-id="${s.id}" style="border-top:4px solid ${d?.color||'var(--pr)'}"><span class="chip ${s.status}">${STL[s.status]}</span><span class="chip">${esc(d?.label||s.domain)}</span><h3 style="margin:8px 0 2px">${esc(s.title)}</h3><div class="sub">${esc((s.description||'').slice(0,110))}</div><div style="margin-top:8px"><b>${s.responses}</b> <span class="sub">réponse(s) · version ${s.version}</span></div></div>`}).join('')||'<div class="empty">Aucune enquête.</div>'};
 draw();$('#fs').onchange=draw;$('#cards').onclick=e=>{const c=e.target.closest('[data-id]');if(c)edit(c.dataset.id)};if($('#new'))$('#new').onclick=()=>edit(null)}
// ================= éditeur (sans JSON)
const domInds=dom=>{const d=S.cat.domains.find(x=>x.key===dom);const base=S.cat.domains.find(x=>x.key==='demographie').indicators.filter(i=>i.key==='household_persons');return [...d.indicators,...(dom==='demographie'?[]:base)]};
const kindOf=i=>i.kind==='number'?'number':i.kind==='share'?'yes_no':i.kind==='scale'?'scale':(i.multi?'multi_choice':'single_choice');
async function edit(id){let s=null;if(id){try{s=await api('/survey-admin/surveys/'+id)}catch(e){return toast(e.message,1)}}
 E=s?{...s,defn:clone(s.definition),_new:false}:{_new:true,domain:S.cat.domains[0].key,title:'',description:'',cooldown_days:30,target_responses:0,starts_at:null,ends_at:null,allow_sensitive_axes:false,status:'draft',defn:{unit:'household',slots:[{key:'rubrique_1',label:'Rubrique 1',help:null,multi:false,allow_none:true,mode:'profile'}],questions:[],rules:[],dimensions:[]}};
 E._tab='gen';$('#v-list').hidden=true;const v=$('#v-edit');v.hidden=false;editor()}
function editor(){const v=$('#v-edit'),n=E._new;
 const tabs=[['gen','Général'],['q','Questions'],...(n?[]:[['pf','Profils proposés'],['st','Statistiques'],['ev','Historique des profils']])];
 v.innerHTML=`<div class="row"><button class="btn gh sm" id="back">← Toutes les enquêtes</button></div><div class="row" style="margin:8px 0"><div class="sp"><h2>${esc(E.title||'Nouvelle enquête')}</h2><div class="sub">${n?'Choisissez le thème puis les questions à poser.':'Version '+E.version+' · '+E.responses+' réponse(s)'}</div></div>${n?'':`<span class="chip ${E.status}">${STL[E.status]}</span>${isAdmin()?statusBtns():''}`}</div>
 <div class="tabs">${tabs.map(([k,l])=>`<button class="${E._tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><div id="ed"></div>
 ${isAdmin()&&['gen','q'].includes(E._tab)?`<div class="bulk"><span class="sub sp">${n?'Étape '+(E._tab==='gen'?'1':'2')+' sur 2':'Modifications non enregistrées ?'}</span>${n&&E._tab==='gen'?'<button class="btn" id="nx">Suivant : questions →</button>':`<button class="btn" id="save">${n?'Créer l\'enquête':'Enregistrer'}</button>`}</div>`:''}`;
 $('#back').onclick=list;$$('.tabs button',v).forEach(b=>b.onclick=()=>{E._tab=b.dataset.t;editor()});
 const body=({gen:eGen,q:eQ,pf:ePf,st:eSt,ev:eEv})[E._tab];body($('#ed'));
 if($('#save'))$('#save').onclick=save;if($('#nx'))$('#nx').onclick=()=>{E._tab='q';editor()};
 $$('[data-sb]',v).forEach(b=>b.onclick=()=>setStatus(b.dataset.sb))}
const statusBtns=()=>({draft:[['active','Activer','ok']],active:[['paused','Mettre en pause','wa'],['closed','Fermer','er']],paused:[['active','Reprendre','ok'],['closed','Fermer','er']],closed:[['active','Rouvrir','ok']]})[E.status].map(([k,l,c])=>`<button class="btn ${c}" data-sb="${k}">${l}</button>`).join('');
async function setStatus(st){try{const r=await api(`/survey-admin/surveys/${E.id}/status`,{method:'POST',body:{status:st,use_ai:false}});toast('Statut mis à jour'+(r.profiles_created?' · '+r.profiles_created+' profil(s) créé(s)':''));edit(E.id)}catch(e){toast(e.message,1)}}
function eGen(el){const d=S.cat.domains;
 el.innerHTML=`<div class="card"><h3>Informations</h3><div class="g2"><label class="f">Thème de l'enquête<select id="g-dom" ${E._new?'':'disabled'}>${d.map(x=>`<option value="${x.key}" ${x.key===E.domain?'selected':''}>${esc(x.label)}</option>`).join('')}</select></label><label class="f">Qui répond ?<select id="g-unit">${UNITS.map(([k,l])=>`<option value="${k}" ${E.defn.unit===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
 <label class="f" style="margin-top:10px">Titre<input id="g-title" maxlength="160" value="${esc(E.title)}"></label><label class="f" style="margin-top:10px">Description<textarea id="g-desc" maxlength="1500">${esc(E.description||'')}</textarea></label>
 <div class="g4" style="margin-top:10px"><label class="f">Délai avant de repondre à nouveau (jours)<input id="g-cd" type="number" min="0" max="365" value="${E.cooldown_days}"></label><label class="f">Objectif de réponses<input id="g-tg" type="number" min="0" value="${E.target_responses}"></label><label class="f">Début<input id="g-s" type="datetime-local" value="${toLoc(E.starts_at)}"></label><label class="f">Fin<input id="g-e" type="datetime-local" value="${toLoc(E.ends_at)}"></label></div>
 <label class="ck" style="margin-top:10px"><input type="checkbox" id="g-sens" ${E.allow_sensitive_axes?'checked':''}>Autoriser les profils sensibles (ethnie, religion, opinion politique)</label></div>
 ${E._new?`<div class="card"><h3>Gagner du temps avec l'IA</h3><div class="sub">Décrivez votre objectif : l'IA propose des questions du catalogue (à relire).</div><div class="row" style="margin-top:8px"><label class="f sp">Objectif<input id="ai-goal" maxlength="500" placeholder="Ex : mesurer l'accès à l'eau potable dans les quartiers"></label><label class="f">Questions max<input id="ai-max" type="number" min="3" max="60" value="12" style="width:100px"></label><button class="btn sec" id="ai-go">Générer un brouillon</button></div></div>`:''}`;
 const bind=(id,f)=>{const x=$(id);x&&(x.oninput=x.onchange=e=>f(e.target))};
 bind('#g-dom',x=>{if(E.defn.questions.length&&!confirm('Changer de thème efface les questions choisies. Continuer ?')){x.value=E.domain;return}E.domain=x.value;E.defn.questions=[]});bind('#g-unit',x=>E.defn.unit=x.value);
 bind('#g-title',x=>E.title=x.value);bind('#g-desc',x=>E.description=x.value);bind('#g-cd',x=>E.cooldown_days=+x.value);bind('#g-tg',x=>E.target_responses=+x.value);
 bind('#g-s',x=>E.starts_at=x.value?new Date(x.value).toISOString():null);bind('#g-e',x=>E.ends_at=x.value?new Date(x.value).toISOString():null);bind('#g-sens',x=>E.allow_sensitive_axes=x.checked);
 if($('#ai-go'))$('#ai-go').onclick=async()=>{const g=$('#ai-goal').value.trim();if(g.length<5)return toast('Décrivez votre objectif (5 caractères min.)',1);
  try{const r=await api('/survey-admin/surveys/design',{method:'POST',body:{domain:E.domain,goal:g,indicators:[],unit:E.defn.unit,max_questions:+$('#ai-max').value}});E.title=r.title;E.description=r.description;E.defn=r.definition;E.defn.rules=E.defn.rules||[];toast('Brouillon généré : relisez les questions.');E._tab='q';editor()}catch(e){toast(e.message,1)}}}
function eQ(el){const D=E.defn,inds=domInds(E.domain),used=new Set(D.questions.map(q=>q.indicator));
 const evalL={none:'Pas de photo',optional:'Photo facultative',required:'Photo obligatoire'};
 const qRow=q=>{const i=IND[q.indicator];return `<div class="blk"><div class="row"><label class="f sp">${esc(i.label)}<input data-q="${q.key}" data-f="text" value="${esc(q.text)}"></label><label class="ck"><input type="checkbox" data-q="${q.key}" data-f="required" ${q.required!==false?'checked':''}>Obligatoire</label><label class="f">Rubrique<select data-q="${q.key}" data-f="slot">${D.slots.map(s=>`<option value="${s.key}" ${s.key===q.slot?'selected':''}>${esc(s.label)}</option>`).join('')}</select></label><button class="btn er sm" data-rm="${q.key}">Retirer</button></div>
  <details><summary>Options</summary><div class="g4" style="margin-top:8px"><label class="ck"><input type="checkbox" data-q="${q.key}" data-f="axis" ${q.axis?'checked':''}>Sert à décrire le profil de la personne</label><label class="f">Photo<select data-q="${q.key}" data-f="evidence">${Object.entries(evalL).map(([k,l])=>`<option value="${k}" ${(q.evidence||'none')===k?'selected':''}>${l}</option>`).join('')}</select></label>
  ${q.evidence&&q.evidence!=='none'?`<label class="f">Consigne photo<input data-q="${q.key}" data-f="evidence_hint" value="${esc(q.evidence_hint||'')}" placeholder="Ex : photo de la façade"></label>`:''}
  ${q.kind==='number'?`<label class="f">Valeur minimale<input type="number" step="any" data-q="${q.key}" data-f="min" value="${q.min??''}" placeholder="${i.lo}"></label><label class="f">Valeur maximale<input type="number" step="any" data-q="${q.key}" data-f="max" value="${q.max??''}" placeholder="${i.hi}"></label>`:''}</div>
  ${i.kind==='category'?`<div class="sub" style="margin-top:8px">Réponses proposées (2 minimum)</div><div class="chks">${i.categories.map(c=>`<label class="ck"><input type="checkbox" data-q="${q.key}" data-f="opt" data-v="${c.code}" ${(q.options||[]).length?(q.options.some(o=>o.value===c.code)?'checked':''):'checked'}>${esc(c.label)}</label>`).join('')}</div>`:''}</details></div>`};
 el.innerHTML=`<div class="g2" style="align-items:start"><div><div class="card" style="margin-top:0"><h3>Indicateurs disponibles</h3><div class="sub">Cochez ce que vous voulez demander.</div><div style="max-height:480px;overflow:auto;margin-top:8px">${inds.map(i=>`<label class="ck" style="padding:4px 0"><input type="checkbox" data-ind="${i.key}" ${used.has(i.key)?'checked':''}>${esc(i.label)}${i.sensitive?' <span class="chip">sensible</span>':''}</label>`).join('')}</div></div></div>
 <div><div class="card" style="margin-top:0"><div class="row"><h3 class="sp" style="margin:0">Rubriques et questions</h3><button class="btn sec sm" id="sl-add">＋ Rubrique</button></div>
 ${D.slots.map(s=>{const qs=D.questions.filter(q=>q.slot===s.key);return `<div class="page-box"><div class="row"><label class="f sp">Nom de la rubrique<input data-s="${s.key}" data-f="label" value="${esc(s.label)}"></label><label class="f">Réponse<select data-s="${s.key}" data-f="mode"><option value="profile" ${s.mode==='profile'?'selected':''}>Choix d'un profil</option><option value="direct" ${s.mode==='direct'?'selected':''}>Saisie directe</option></select></label>${s.mode==='profile'?`<label class="ck"><input type="checkbox" data-s="${s.key}" data-f="multi" ${s.multi?'checked':''}>Plusieurs profils possibles</label>`:''}<label class="ck"><input type="checkbox" data-s="${s.key}" data-f="allow_none" ${s.allow_none?'checked':''}>« Aucun ne me correspond »</label>${D.slots.length>1&&!qs.length?`<button class="btn er sm" data-sd="${s.key}">Supprimer</button>`:''}</div>${qs.map(qRow).join('')||'<div class="empty">Cochez des indicateurs à gauche.</div>'}</div>`}).join('')}
 ${D.rules?.length?`<div class="sub">${D.rules.length} règle(s) de cohérence existante(s) conservée(s). Les règles de base (totaux, etc.) restent appliquées automatiquement.</div>`:''}</div></div></div>`;
 const Qf=k=>D.questions.find(q=>q.key===k),Sf=k=>D.slots.find(s=>s.key===k);
 $$('[data-ind]',el).forEach(c=>c.onchange=()=>{const i=IND[c.dataset.ind];if(c.checked)D.questions.push({key:i.key,slot:D.slots[0].key,text:i.label,kind:kindOf(i),indicator:i.key,required:true});else D.questions=D.questions.filter(q=>q.key!==i.key);eQ(el)});
 $$('[data-rm]',el).forEach(b=>b.onclick=()=>{D.questions=D.questions.filter(q=>q.key!==b.dataset.rm);eQ(el)});
 $$('[data-q]',el).forEach(x=>x.onchange=()=>{const q=Qf(x.dataset.q),f=x.dataset.f;
  if(f==='required')q.required=x.checked;else if(f==='axis'){x.checked?q.axis=q.indicator:delete q.axis}
  else if(f==='opt'){const all=$$(`[data-q="${q.key}"][data-f="opt"]:checked`,el).map(c=>({value:c.dataset.v}));if(all.length<2){x.checked=true;return toast('Gardez au moins 2 réponses',1)}q.options=all}
  else if(f==='min'||f==='max'){x.value===''?delete q[f]:q[f]=+x.value}else if(f==='evidence'){q.evidence=x.value;eQ(el);return}else q[f]=x.value;if(f==='slot')eQ(el)});
 $$('[data-s]',el).forEach(x=>x.onchange=()=>{const s=Sf(x.dataset.s),f=x.dataset.f;s[f]=x.type==='checkbox'?x.checked:x.value;if(f==='mode')eQ(el)});
 $$('[data-sd]',el).forEach(b=>b.onclick=()=>{D.slots=D.slots.filter(s=>s.key!==b.dataset.sd);eQ(el)});
 $('#sl-add').onclick=()=>{let n=D.slots.length+1,k;do{k='rubrique_'+n++}while(D.slots.some(s=>s.key===k));D.slots.push({key:k,label:'Rubrique '+(n-1),help:null,multi:false,allow_none:true,mode:'profile'});eQ(el)}}
async function save(){const D=E.defn;if(!E.title||E.title.trim().length<3)return toast('Donnez un titre à l\'enquête (3 caractères min.)',1);if(!D.questions.length)return toast('Choisissez au moins une question',1);
 const used=new Set(D.questions.map(q=>q.slot));D.slots=D.slots.filter(s=>used.has(s.key));D.dimensions=[...new Set([...(D.dimensions||[]),...D.questions.filter(q=>q.axis).map(q=>q.axis)])];
 const b={title:E.title.trim(),description:E.description||null,definition:D,cooldown_days:E.cooldown_days,target_responses:E.target_responses,starts_at:E.starts_at,ends_at:E.ends_at,allow_sensitive_axes:E.allow_sensitive_axes};
 try{if(E._new){const r=await api('/survey-admin/surveys',{method:'POST',body:{...b,domain:E.domain}});toast('Enquête créée. Activez-la quand vous êtes prêt.');edit(r.id)}else{const r=await api('/survey-admin/surveys/'+E.id,{method:'PATCH',body:b});toast('Enregistré'+(r.definition_changed?' (version '+r.version+')':''));edit(E.id)}}catch(e){toast(e.message,1)}}
// ================= profils (formulaire, sans JSON)
function ansForm(slot){return E.defn.questions.filter(q=>q.slot===slot).map(q=>{const i=IND[q.indicator],id='af-'+q.key;let c;
 if(q.kind==='number')c=`<input type="number" step="any" id="${id}" min="${q.min??i.lo}" max="${q.max??i.hi}">`;
 else if(q.kind==='scale')c=`<select id="${id}">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select>`;
 else if(q.kind==='yes_no')c=`<select id="${id}"><option value="true">Oui</option><option value="false">Non</option></select>`;
 else if(q.kind==='single_choice')c=`<select id="${id}">${(q.options||[]).map(o=>`<option value="${esc(o.value)}">${esc(o.label||o.value)}</option>`).join('')}</select>`;
 else c=`<div class="chks" id="${id}">${(q.options||[]).map(o=>`<label class="ck"><input type="checkbox" value="${esc(o.value)}">${esc(o.label||o.value)}</label>`).join('')}</div>`;
 return `<label class="f">${esc(q.short||q.text)}${c}</label>`}).join('')}
function readAns(slot){const a={};for(const q of E.defn.questions.filter(q=>q.slot===slot)){const el=$('#af-'+q.key);
 if(q.kind==='number'){if(el.value==='')throw new Error('Renseignez : '+q.text);a[q.key]=+el.value}else if(q.kind==='scale')a[q.key]=+el.value;else if(q.kind==='yes_no')a[q.key]=el.value==='true';else if(q.kind==='single_choice')a[q.key]=el.value;
 else{const v=$$('input:checked',el).map(c=>c.value);if(!v.length)throw new Error('Choisissez au moins une réponse : '+q.text);a[q.key]=v}}return a}
async function ePf(el){el.innerHTML='<div class="empty">Chargement…</div>';
 try{const profs=await api(`/survey-admin/surveys/${E.id}/profiles`);const slots=E.defn.slots.filter(s=>s.mode==='profile');
  if(!slots.length){el.innerHTML='<div class="empty">Aucune rubrique en « choix d\'un profil ».</div>';return}
  const by={};profs.forEach(p=>(by[p.slot]=by[p.slot]||[]).push(p));
  el.innerHTML=`<div class="card"><div class="sub">Un profil est un ensemble de réponses cohérentes qu'une personne reconnaît comme les siennes. Ils évoluent avec les vrais choix des répondants.</div>${isAdmin()?`<div class="row" style="margin-top:8px"><select id="pf-slot" style="width:auto">${slots.map(s=>`<option value="${s.key}">${esc(s.label)}</option>`).join('')}</select><label class="ck"><input type="checkbox" id="pf-ai">Avec l'IA</label><button class="btn" id="pf-gen">Générer des profils</button><button class="btn sec" id="pf-ev">Faire évoluer maintenant</button><button class="btn sec" id="pf-add">Créer un profil à la main</button></div><div id="pf-form"></div>`:''}</div>
  ${slots.map(s=>`<div class="card tw" style="padding:0"><div style="padding:14px"><h3 style="margin:0">${esc(s.label)}</h3></div><table><thead><tr><th>Profil</th><th>Origine</th><th>État</th><th>Affiché</th><th>Choisi</th><th>Part des choix</th><th></th></tr></thead><tbody>${(by[s.key]||[]).map(p=>`<tr><td><b>${esc(p.label)}</b><div class="sub">${(p.summary||[]).map(x=>esc(x.answer)).join(' · ')}</div></td><td><span class="chip">${ORG[p.origin]||p.origin}</span></td><td><span class="chip ${p.status==='active'?'active':'closed'}">${p.status==='active'?'Actif':'Retiré'}</span></td><td>${p.shown}</td><td>${p.picked}</td><td>${p.share_of_picks!=null?Math.round(p.share_of_picks*100)+' %':'—'}</td><td style="white-space:nowrap">${isAdmin()?`<button class="btn sec sm" data-pin="${p.id}" data-v="${p.pinned}">${p.pinned?'Détacher':'Épingler'}</button> <button class="btn sec sm" data-ret="${p.id}" data-st="${p.status}">${p.status==='active'?'Retirer':'Réactiver'}</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Aucun profil.</td></tr>'}</tbody></table></div>`).join('')}`;
  $$('[data-pin]',el).forEach(b=>b.onclick=async()=>{try{await api('/survey-admin/profiles/'+b.dataset.pin,{method:'PATCH',body:{pinned:b.dataset.v!=='true'}});ePf(el)}catch(e){toast(e.message,1)}});
  $$('[data-ret]',el).forEach(b=>b.onclick=async()=>{try{await api('/survey-admin/profiles/'+b.dataset.ret,{method:'PATCH',body:{retire:b.dataset.st==='active'}});ePf(el)}catch(e){toast(e.message,1)}});
  if(!isAdmin())return;
  $('#pf-gen').onclick=async()=>{try{const r=await api(`/survey-admin/surveys/${E.id}/profiles/generate`,{method:'POST',body:{slot:$('#pf-slot').value,n:null,use_ai:$('#pf-ai').checked}});toast(r.added+' profil(s) ajouté(s)');ePf(el)}catch(e){toast(e.message,1)}};
  $('#pf-ev').onclick=async()=>{try{const r=await api(`/survey-admin/surveys/${E.id}/evolve`,{method:'POST',body:{use_ai:$('#pf-ai').checked}});toast('Génération '+r.generation+' créée');ePf(el)}catch(e){toast(e.message,1)}};
  $('#pf-add').onclick=()=>{const sl=$('#pf-slot').value;$('#pf-form').innerHTML=`<div class="sub-card"><div class="g2"><label class="f">Nom du profil<input id="pn" maxlength="120"></label><label class="f">Description (facultatif)<input id="pd" maxlength="300"></label></div><div class="g2" style="margin-top:8px">${ansForm(sl)}</div><button class="btn" id="ps" style="margin-top:10px">Créer le profil</button></div>`;
   $('#ps').onclick=async()=>{try{const a=readAns(sl);await api(`/survey-admin/surveys/${E.id}/profiles`,{method:'POST',body:{slot:sl,label:$('#pn').value.trim(),description:$('#pd').value.trim()||null,answers:a}});toast('Profil créé');ePf(el)}catch(e){toast(e.message,1)}}}
 }catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function eSt(el){el.innerHTML='<div class="empty">Chargement…</div>';
 try{const st=await api(`/survey-admin/surveys/${E.id}/stats`,{query:{days:30}});const col={validated:'#16a34a',indicative:'#d97706',rejected:'#dc2626',pending:'#64748b'};
  el.innerHTML=`<div class="kpis">${kpi('Réponses',st.total)}${kpi('Contributeurs',st.contributors)}${kpi('Zones couvertes',st.cells_covered)}${st.progress!=null?kpi('Objectif atteint',Math.round(st.progress*100)+' %'):''}${kpi('Génération de profils',st.profile_generation)}</div>
  <div class="g2"><div class="card"><h3>Qualité des réponses</h3>${Ch.donut(Object.entries(st.by_status).map(([k,v])=>({l:QSL[k],v})))}</div><div class="card"><h3>Mode de réponse</h3>${Ch.donut(Object.entries(st.modes).map(([k,v])=>({l:MODE[k]||k,v})))}</div></div>
  <div class="card"><h3>Réponses par jour</h3>${st.days.length?Ch.line([{name:'Réponses',v:st.days.map(d=>d.pending+d.validated+d.indicative+d.rejected)}],st.days.map(d=>d.date.slice(5))):'<div class="empty">Aucune donnée</div>'}</div>
  <div class="g2"><div class="card"><h3>Raisons les plus fréquentes</h3>${Ch.bars(st.top_reasons.map(r=>({l:r.label,v:r.n})))}</div><div class="card"><h3>« Aucun profil ne me correspond »</h3>${Ch.bars(Object.entries(st.none_rate_by_slot).map(([k,v])=>({l:(E.defn.slots.find(s=>s.key===k)||{}).label||k,v:Math.round(v*100)})))}<div class="sub">En % des réponses.</div></div></div>`}catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function eEv(el){try{const ev=await api(`/survey-admin/surveys/${E.id}/profile-events`);
 el.innerHTML=ev.map(e=>`<div class="card"><div class="row"><b class="sp">Génération ${e.generation}</b><span class="sub">${fd(e.at)}</span></div><div class="sub">${e.method==='ai+data'?'IA et réponses réelles':'Réponses réelles'} · <span class="up">+${e.added} ajoutés</span> · <span class="down">−${e.retired} retirés</span></div>${Object.entries(e.details?.slots||{}).map(([k,s])=>`<div style="margin-top:6px"><b>${esc((E.defn.slots.find(x=>x.key===k)||{}).label||k)}</b> <span class="sub">· « aucun ne correspond » : ${Math.round((s.none_rate||0)*100)} %</span>${s.added.map(a=>`<div class="up">+ ${esc(a.label)}</div>`).join('')}${s.retired.map(a=>`<div class="down">− ${esc(a)}</div>`).join('')}</div>`).join('')}</div>`).join('')||'<div class="empty">Aucun événement.</div>'}catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
// ================= réponses
async function tRs(){const el=$('#tab');
 el.innerHTML=`<div class="card"><div class="row"><label class="f">Enquête<select id="r-sv"><option value="">Toutes</option>${S.surveys.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></label><div class="pills" id="r-st">${Object.entries(QSL).map(([k,v])=>`<button class="pill ${k!=='validated'?'on':''}" data-st="${k}">${v}</button>`).join('')}</div><div class="sp"></div><label class="f">Décision<select id="r-ev"><option value="">Toutes</option><option value="auto">Automatique</option><option value="admin">Admin</option></select></label><label class="f">Par page<select id="r-sz"><option>25</option><option selected>50</option><option>100</option></select></label><button class="btn" id="r-go">Filtrer</button></div></div>
 <div class="card tw" style="padding:0"><table><thead><tr><th><input type="checkbox" id="r-all"></th><th>Date</th><th>Enquête</th><th>Mode</th><th>Statut</th><th>Fiabilité</th><th>Raisons</th></tr></thead><tbody id="r-rows"></tbody></table></div>
 <div class="row" style="margin-top:10px"><span id="r-ct" class="sub sp"></span><button class="btn sec sm" id="r-pv">←</button><button class="btn sec sm" id="r-nx">→</button></div>
 <div class="bulk" id="r-bulk" hidden><b id="r-bc"></b><select id="r-bs" style="width:auto"><option value="validated">Valider</option><option value="indicative">Indicative</option><option value="rejected">Rejeter</option></select><input id="r-br" placeholder="Motif (3 caractères min.)" style="flex:1;min-width:200px"><button class="btn" id="r-ba">Appliquer</button><button class="btn sec" id="r-brl">Remettre en automatique</button></div>`;
 S.resp.off=0;S.sel.clear();const st=()=>$$('#r-st .on').map(b=>b.dataset.st);
 $('#r-st').onclick=e=>e.target.dataset.st&&e.target.classList.toggle('on');
 const ld=async()=>{try{const d=await api('/survey-admin/responses',{query:{survey_id:$('#r-sv').value,status:st(),evaluator:$('#r-ev').value,limit:$('#r-sz').value,offset:S.resp.off}});S.resp.items=d.items;S.resp.total=d.total;S.sel.clear();rrows()}catch(e){toast(e.message,1)}};
 const bulk=()=>{$('#r-bulk').hidden=!isAdmin()||!S.sel.size;$('#r-bc').textContent=S.sel.size+' sélectionnée(s)'};
 function rrows(){const sz=+$('#r-sz').value;$('#r-rows').innerHTML=S.resp.items.map(r=>`<tr><td><input type="checkbox" class="rs" data-id="${r.id}"></td><td>${fd(r.submitted_at)}</td><td>${esc(r.survey)}</td><td><span class="chip">${MODE[r.mode]||r.mode}</span></td><td><span class="chip ${r.quality_status}">${QSL[r.quality_status]}</span></td><td>${r.score!=null?Math.round(r.score*100)+' %':'—'}</td><td>${(r.reasons||[]).filter(x=>x.severity!=='info').map(x=>`<span class="chip" title="${esc(x.tip||'')}">${esc(x.label)}</span>`).join('')||'—'}</td></tr>
  <tr><td colspan="7"><details><summary>Détail</summary><ul style="margin:6px 0 6px 16px">${(r.answers||[]).map(a=>`<li><b>${esc(a.question)}</b> : ${esc(a.answer)}</li>`).join('')}</ul>${(r.evidence||[]).map(e=>`<button class="btn sec sm" data-ev="${e.id}">Photo : ${esc(e.question)}</button> `).join('')}<div class="sub">GPS ${Math.round(r.gps_accuracy_m)} m · ${r.duration_seconds}s · pondération ${r.weight}</div></details></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Aucune réponse.</td></tr>';
  $('#r-ct').textContent=`${S.resp.total} réponse(s) · ${Math.min(S.resp.off+1,S.resp.total)}–${Math.min(S.resp.off+sz,S.resp.total)}`;$('#r-pv').disabled=!S.resp.off;$('#r-nx').disabled=S.resp.off+sz>=S.resp.total;bulk()}
 $('#r-rows').onchange=e=>{if(e.target.classList.contains('rs')){e.target.checked?S.sel.add(e.target.dataset.id):S.sel.delete(e.target.dataset.id);bulk()}};
 $('#r-rows').onclick=async e=>{const id=e.target.dataset.ev;if(!id)return;try{const r=await raw('/survey-admin/evidence/'+id+'/content');if(!r.ok)throw new Error('Photo indisponible');const u=URL.createObjectURL(await r.blob());window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(x){toast(x.message,1)}};
 $('#r-all').onchange=e=>{S.resp.items.forEach(r=>e.target.checked?S.sel.add(r.id):S.sel.delete(r.id));$$('.rs').forEach(c=>c.checked=e.target.checked);bulk()};
 $('#r-go').onclick=()=>{S.resp.off=0;ld()};$('#r-pv').onclick=()=>{S.resp.off=Math.max(0,S.resp.off-+$('#r-sz').value);ld()};$('#r-nx').onclick=()=>{S.resp.off+=+$('#r-sz').value;ld()};
 $('#r-ba').onclick=async()=>{const r=$('#r-br').value.trim();if(r.length<3)return toast('Motif (3 caractères min.)',1);try{const x=await api('/survey-admin/responses/bulk',{method:'POST',body:{ids:[...S.sel],status:$('#r-bs').value,reason:r}});toast(x.updated+' mise(s) à jour');ld()}catch(e){toast(e.message,1)}};
 $('#r-brl').onclick=async()=>{try{const x=await api('/survey-admin/responses/release',{method:'POST',body:{ids:[...S.sel]}});toast(x.released+' remise(s) en évaluation');ld()}catch(e){toast(e.message,1)}};ld()}
async function tRd(){const el=$('#tab');try{const d=await api('/survey-admin/respondents');el.innerHTML=`<div class="g2"><div class="card"><h3>Profils de comportement</h3>${Ch.donut(Object.entries(d.personas||{}).map(([k,v])=>({l:k,v})))}</div><div class="card"><h3>À savoir</h3><div class="sub">Le score mesure l'incohérence et l'écart aux tendances, pas l'honnêteté. Seuls les 90 derniers jours comptent.</div></div></div>
 <div class="card tw" style="padding:0"><div style="padding:14px"><h3 style="margin:0">Confiance la plus faible</h3></div><table><thead><tr><th>Pseudo</th><th>Confiance</th><th>Profil</th><th>Réponses</th><th>Tendance</th><th>Signaux</th></tr></thead><tbody>${(d.lowest_trust||[]).map(u=>`<tr><td>${esc(u.pseudonym)}</td><td>${Math.round(u.trust*100)} %</td><td>${esc(u.persona)}</td><td>${u.responses}</td><td>${u.trend>.03?'↑':u.trend<-.03?'↓':'='}</td><td>${(u.flags||[]).map(f=>`<span class="chip">${esc(f)}</span>`).join('')||'—'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucun répondant à faible confiance.</td></tr>'}</tbody></table></div>`}catch(e){el.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
// ================= références
async function tRf(){const el=$('#tab');
 const opts=S.cat.domains.map(d=>`<optgroup label="${esc(d.label)}">${d.indicators.filter(i=>['number','scale','share','category'].includes(i.kind)).map(i=>`<option value="${i.key}">${esc(i.label)}</option>`).join('')}</optgroup>`).join('');
 el.innerHTML=`<div class="card"><div class="sub">Valeurs officielles (recensement, enquête nationale…) utilisées pour contrôler et comparer les réponses. Rien n'est inventé : seules les valeurs que vous saisissez sont utilisées.</div>${isAdmin()?`<button class="btn" id="rf-add" style="margin-top:8px">＋ Ajouter une valeur</button>`:''}</div><div class="card tw" style="padding:0"><table><thead><tr><th>Indicateur</th><th>Valeur</th><th>Périmètre</th><th>Année</th><th>Source</th><th></th></tr></thead><tbody id="rf-rows"></tbody></table></div>`;
 const ld=async()=>{try{const it=await api('/survey-admin/reference');$('#rf-rows').innerHTML=it.map(r=>`<tr><td>${esc(IND[r.indicator_key]?.label||r.indicator_key)}${r.category?` <span class="chip">${esc(r.category)}</span>`:''}</td><td><b>${r.value}</b> <span class="sub">${r.stat==='share'?'(part)':'(moyenne)'}</span></td><td>${r.scope_h3?esc(r.scope_h3)+' (r'+r.scope_res+')':'National'}</td><td>${r.period_year||'—'}</td><td>${esc(r.source)}</td><td>${isAdmin()?`<button class="btn er sm" data-d="${r.id}">Supprimer</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucune valeur de référence.</td></tr>'}catch(e){toast(e.message,1)}};
 $('#rf-rows').onclick=async e=>{const id=e.target.dataset.d;if(!id||!confirm('Supprimer ?'))return;try{await api('/survey-admin/reference/'+id,{method:'DELETE'});ld()}catch(x){toast(x.message,1)}};
 if($('#rf-add'))$('#rf-add').onclick=()=>{const m=modal(`<h3>Nouvelle valeur de référence</h3><div class="g2"><label class="f">Indicateur<select id="m-i">${opts}</select></label><label class="f" id="m-cw">Réponse concernée<select id="m-c"></select></label><label class="f">Valeur<input id="m-v" type="number" step="any"></label><label class="f">Source *<input id="m-s" placeholder="Ex : Recensement 2023"></label><label class="f">Année<input id="m-y" type="number" min="1900" max="2100"></label><label class="f">Zone (code H3, facultatif)<input id="m-h"></label><label class="f">Résolution de la zone<input id="m-r" type="number" min="3" max="9"></label></div><div class="sub" id="m-hint"></div><div class="row" style="margin-top:12px"><button class="btn" id="m-ok">Enregistrer</button><button class="btn sec" data-close>Annuler</button></div>`);
  const sync=()=>{const i=IND[$('#m-i').value];$('#m-cw').hidden=i.kind!=='category';if(i.kind==='category')$('#m-c').innerHTML=i.categories.map(c=>`<option value="${c.code}">${esc(c.label)}</option>`).join('');$('#m-hint').textContent=i.kind==='number'||i.kind==='scale'?'Valeur moyenne attendue ('+(i.unit||'')+').':'Part attendue, entre 0 et 1 (ex : 0.65 pour 65 %).'};$('#m-i').onchange=sync;sync();
  $('#m-ok').onclick=async()=>{const i=IND[$('#m-i').value],num=i.kind==='number'||i.kind==='scale';try{await api('/survey-admin/reference',{method:'POST',body:{items:[{indicator_key:i.key,stat:num?'mean':'share',category:i.kind==='category'?$('#m-c').value:null,value:+$('#m-v').value,scope_h3:$('#m-h').value.trim()||null,scope_res:$('#m-r').value?+$('#m-r').value:null,period_year:$('#m-y').value?+$('#m-y').value:null,source:$('#m-s').value.trim()}]}});m.remove();toast('Valeur ajoutée');ld()}catch(e){toast(e.message,1)}}};ld()}
function tCt(){$('#tab').innerHTML=S.cat.domains.map(d=>`<details class="card"><summary><b style="color:${d.color}">${esc(d.label)}</b> <span class="sub">· ${d.indicators.length} indicateurs</span></summary><div class="sub">${esc(d.summary)}</div><table style="margin-top:8px"><thead><tr><th>Indicateur</th><th>Type</th><th>Unité</th></tr></thead><tbody>${d.indicators.map(i=>`<tr><td>${esc(i.label)}${i.sensitive?' <span class="chip">sensible</span>':''}</td><td>${{number:'Nombre',share:'Oui / Non',scale:'Échelle 1-5',category:'Choix'}[i.kind]}</td><td>${esc(i.unit)}</td></tr>`).join('')}</tbody></table></details>`).join('')}
</script></body></html>
