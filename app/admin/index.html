<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SunuSound · Mesures</title><link rel="stylesheet" href="admin.css"></head><body>
<script src="admin.js"></script>
<script>
boot({page:'mesures',roles:['tenant_admin','analyst'],ready:init});
const LAB={level_out_of_range:'Niveau hors plage plausible',inconsistent_levels:'Niveaux Lmin / LAeq / Lmax incohérents',timestamp_in_future:'Date dans le futur',measurement_too_old:'Mesure trop ancienne',gps_accuracy_too_low:'GPS trop imprécis',capture_too_short:'Capture trop courte',audio_saturation:'Micro saturé',moved_during_capture:'Déplacement pendant la mesure',uncalibrated_device:'Téléphone non calibré',neighbor_outlier:'Écart avec les zones voisines',insufficient_neighbors:'Peu de voisines pour comparer',low_score:'Score global trop bas',admin_override:"Décision d'un administrateur",peer_confirmed:'Confirmée par les analyseurs',peer_rejected:'Rejetée par les analyseurs',peer_adjusted_up:'Corrigée à la hausse (analyseurs)',peer_adjusted_down:'Corrigée à la baisse (analyseurs)'};
const SUBL={gps:'GPS',duration:'Durée',saturation:'Saturation',movement:'Immobilité',calibration:'Calibration',neighbor:'Voisines'};
const STL={pending:'En évaluation',indicative:'Indicative',rejected:'Rejetée',validated:'Validée'};
const Q={off:0,total:0,items:[],sel:new Set(),open:new Set(),st:['pending','indicative','rejected']};
const isAdmin=()=>A.me.role==='tenant_admin';
function init(){
 $('#main').innerHTML=`<h2>Validation des mesures</h2><div class="sub">Contrôlez la fiabilité des mesures envoyées par les contributeurs.</div>
 <div class="tabs"><button class="on" data-t="val">À vérifier</button><button data-t="stats">Statistiques</button></div>
 <section id="t-val"><div class="card"><div class="row"><div class="pills" id="pl">${Object.entries(STL).map(([k,v])=>`<button class="pill ${Q.st.includes(k)?'on':''}" data-st="${k}">${v}</button>`).join('')}</div><div class="sp"></div>
  <label class="f">Trier par<select id="f-sort"><option value="recent">Plus récentes</option><option value="score_asc">Score croissant</option><option value="score_desc">Score décroissant</option><option value="laeq_desc">Plus bruyantes</option></select></label>
  <label class="f">Par page<select id="f-size"><option>25</option><option selected>50</option><option>100</option><option>200</option></select></label><button class="btn" id="f-go">Appliquer</button></div>
  <details style="margin-top:8px"><summary>Plus de filtres</summary><div class="g4" style="margin-top:8px">
  <label class="f">Score min (0-1)<input id="f-smin" type="number" step="0.05" min="0" max="1"></label><label class="f">Score max (0-1)<input id="f-smax" type="number" step="0.05" min="0" max="1"></label>
  <label class="f">Téléphone<select id="f-cal"><option value="">Tous</option><option value="calibrated">Calibré</option><option value="uncalibrated">Non calibré</option></select></label>
  <label class="f">Décision<select id="f-eval"><option value="">Toutes</option><option value="auto">Automatique</option><option value="admin">Administrateur</option></select></label>
  <label class="f">Raison<select id="f-reason"><option value="">Toutes</option></select></label><label class="f">Zone (code H3)<input id="f-h3"></label>
  <label class="f">Du<input id="f-from" type="date"></label><label class="f">Au<input id="f-to" type="date"></label></div></details></div>
 <div class="card tw" style="padding:0"><table><thead><tr><th><input type="checkbox" id="all"></th><th>Date</th><th>Zone</th><th>Niveau</th><th>Fiabilité</th><th>Statut</th><th>Raisons</th><th>Décision</th><th class="adm"></th></tr></thead><tbody id="rows"></tbody></table></div>
 <div class="row" style="margin-top:10px"><span id="count" class="sub sp"></span><button class="btn sec sm" id="prev">← Précédent</button><button class="btn sec sm" id="next">Suivant →</button></div></section>
 <section id="t-stats" hidden></section>
 <div class="bulk" id="bulk" hidden><b id="b-count"></b><select id="b-status" style="width:auto"><option value="validated">Valider</option><option value="indicative">Marquer indicative</option><option value="rejected">Rejeter</option></select><input id="b-reason" placeholder="Motif (3 caractères min.)" style="flex:1;min-width:200px"><button class="btn" id="b-apply">Appliquer</button><button class="btn sec" id="b-release" title="Remet les mesures en évaluation automatique">Remettre en automatique</button><button class="btn gh" id="b-clear">Désélectionner</button></div>`;
 if(!isAdmin())$$('.adm').forEach(x=>x.remove());
 $$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#t-val').hidden=b.dataset.t!=='val';$('#t-stats').hidden=b.dataset.t!=='stats';if(b.dataset.t==='stats')loadStats();bulkUi()});
 $('#pl').onclick=e=>{const k=e.target.dataset.st;if(!k)return;Q.st=Q.st.includes(k)?Q.st.filter(x=>x!==k):[...Q.st,k];e.target.classList.toggle('on');Q.off=0;load()};
 $('#f-go').onclick=()=>{Q.off=0;load()};$('#prev').onclick=()=>{Q.off=Math.max(0,Q.off-+$('#f-size').value);load()};$('#next').onclick=()=>{Q.off+=+$('#f-size').value;load()};
 $('#all').onchange=e=>{Q.items.forEach(m=>e.target.checked?Q.sel.add(m.id):Q.sel.delete(m.id));$$('.sel').forEach(c=>c.checked=e.target.checked);bulkUi()};
 $('#rows').addEventListener('click',onRow);
 $('#b-apply').onclick=()=>{const r=$('#b-reason').value.trim();if(r.length<3)return toast('Indiquez un motif (3 caractères min.)',1);if(Q.sel.size>200)return toast('200 mesures maximum par action',1);apply([...Q.sel],$('#b-status').value,r)};
 $('#b-release').onclick=async()=>{try{const r=await api('/validation/release',{method:'POST',body:{ids:[...Q.sel]}});toast(r.released+' mesure(s) remise(s) en évaluation automatique');load()}catch(e){toast(e.message,1)}};
 $('#b-clear').onclick=()=>{Q.sel.clear();$$('.sel').forEach(c=>c.checked=false);bulkUi()};
 $('#s-days')&&0;loadReasons();load()}
async function loadReasons(){try{const s=await api('/validation/stats',{query:{days:30}});s.top_reasons.forEach(r=>$('#f-reason').append(new Option(`${LAB[r.code]||r.code} (${r.n})`,r.code)))}catch{}}
const filt=()=>({status:Q.st,min_score:$('#f-smin').value,max_score:$('#f-smax').value,calibration:$('#f-cal').value,evaluator:$('#f-eval').value,reason:$('#f-reason').value,h3_index:$('#f-h3').value.trim(),date_from:$('#f-from').value,date_to:$('#f-to').value,sort:$('#f-sort').value,limit:$('#f-size').value,offset:Q.off});
async function load(){try{const d=await api('/validation/queue',{query:filt()});Q.items=d.items;Q.total=d.total;Q.sel.clear();Q.open.clear();rows()}catch(e){toast(e.message,1)}}
const chip=s=>`<span class="chip ${s}">${STL[s]||s}</span>`;
function rows(){const size=+$('#f-size').value,b=$('#rows'),ad=isAdmin();
 b.innerHTML=Q.items.map(m=>{const rs=(m.reasons||[]).filter(r=>r.code!=='insufficient_neighbors').map(r=>`<span class="chip" title="${esc(r.reason||'')}">${esc(LAB[r.code]||r.code)}</span>`).join('')||'<span class="sub">—</span>';
  const sc=m.quality_score==null?'–':`${Math.round(m.quality_score*100)} %<div class="bt"><i style="width:${m.quality_score*100}%;background:var(--pr)"></i></div>`;
  const subs=Object.entries(m.sub_scores||{}).map(([k,v])=>`<div class="sub">${SUBL[k]||k}<b style="display:block;color:var(--tx)">${Math.round(v*100)} %</b></div>`).join('');
  const tech=[['Durée',`${m.effective_duration_seconds}/${m.duration_seconds} s`],['Précision GPS',Math.round(m.gps_accuracy_m)+' m'],['Saturation',(m.saturation_ratio*100).toFixed(1)+' %'],['Déplacement',Math.round(m.moved_distance_m)+' m'],['Lmin',m.lmin_db+' dB'],['Plage',m.day_part],['Contexte',m.noise_context||'—'],['Téléphone',m.calibration_status==='calibrated'?'Calibré':'Non calibré'],['Contributeur',m.contributor_token]].map(([k,v])=>`<div class="sub">${k}<b style="display:block;color:var(--tx)">${esc(v)}</b></div>`).join('');
  return `<tr class="r" data-id="${m.id}"><td><input type="checkbox" class="sel" ${Q.sel.has(m.id)?'checked':''}></td><td>${fd(m.measured_at)}</td><td title="${esc(m.h3_index)}">…${esc(m.h3_index.slice(-7))}</td><td><b>${m.laeq_db}</b> dB(A)<div class="sub">max ${m.lmax_db}</div></td><td style="min-width:90px">${sc}</td><td>${chip(m.quality_status)}</td><td>${rs}</td><td class="sub">${m.evaluator==='admin'?'Admin':m.evaluator==='peer'?'Analyseurs':'Auto'}</td>${ad?`<td style="white-space:nowrap"><button class="btn ok sm" data-a="validated" title="Valider">✓</button> <button class="btn wa sm" data-a="indicative" title="Indicative">~</button> <button class="btn er sm" data-a="rejected" title="Rejeter">✗</button></td>`:''}</tr>
  <tr data-det="${m.id}" hidden><td colspan="9" style="background:var(--bg)"><div class="g4">${subs}${tech}</div><div style="margin-top:8px">${(m.reasons||[]).map(r=>`<div class="sub"><b style="color:var(--tx)">${esc(LAB[r.code]||r.code)}</b> ${esc(r.reason||'')}${r.z!=null?' · écart '+r.z:''}</div>`).join('')}</div></td></tr>`}).join('')||`<tr><td colspan="9" class="empty">Aucune mesure pour ces filtres.</td></tr>`;
 $('#count').textContent=`${Q.total} mesure(s) · ${Math.min(Q.off+1,Q.total)}–${Math.min(Q.off+size,Q.total)}`;$('#prev').disabled=Q.off===0;$('#next').disabled=Q.off+size>=Q.total;$('#all').checked=false;bulkUi()}
function onRow(e){const tr=e.target.closest('tr.r');if(!tr)return;const id=tr.dataset.id;
 if(e.target.classList.contains('sel')){e.target.checked?Q.sel.add(id):Q.sel.delete(id);bulkUi();return}
 const a=e.target.closest('button[data-a]');if(a){const r=prompt('Motif de la décision (3 caractères min.)','Validation manuelle');if(r&&r.trim().length>=3)apply([id],a.dataset.a,r.trim());return}
 const d=$(`tr[data-det="${CSS.escape(id)}"]`);d.hidden=!d.hidden}
function bulkUi(){$('#bulk').hidden=!(isAdmin()&&!$('#t-val').hidden&&Q.sel.size>0);$('#b-count').textContent=Q.sel.size+' sélectionnée(s)'}
async function apply(ids,status,reason){try{const r=await api('/validation/bulk',{method:'POST',body:{ids,status,reason}});toast(r.updated+' mesure(s) mise(s) à jour');load()}catch(e){toast(e.message,1)}}
async function loadStats(){const el=$('#t-stats');el.innerHTML=`<div class="row" style="margin-top:14px"><label class="f">Période<select id="s-days"><option value="7">7 jours</option><option value="14" selected>14 jours</option><option value="30">30 jours</option><option value="90">90 jours</option></select></label></div><div id="s-body"></div>`;$('#s-days').onchange=statsBody;statsBody()}
async function statsBody(){const el=$('#s-body');let h='';
 try{const s=await api('/validation/stats',{query:{days:$('#s-days').value}});const col={validated:'#16a34a',indicative:'#d97706',rejected:'#dc2626',pending:'#64748b'};
  h+=`<div class="kpis">${Object.entries(s.totals).map(([k,v])=>kpi(STL[k],v)).join('')}${kpi('Décisions admin',s.admin_overrides)}${kpi('Bloquées > 5 min',s.pending_stuck)}</div>
  <div class="g2"><div class="card"><h3>Qualité par jour</h3>${s.days.map(d=>{const t=d.validated+d.indicative+d.rejected+d.pending;return `<div class="row" style="align-items:center;margin:4px 0;flex-wrap:nowrap"><span class="sub" style="width:80px">${d.date}</span><div style="flex:1">${Ch.stack(['validated','indicative','rejected','pending'].map(k=>({l:STL[k],v:d[k],c:col[k]})))}</div><span class="sub" style="width:36px;text-align:right">${t}</span></div>`}).join('')||'<div class="empty">Aucune donnée</div>'}</div>
  <div class="card"><h3>Raisons les plus fréquentes</h3>${Ch.bars(s.top_reasons.map(r=>({l:LAB[r.code]||r.code,v:r.n})))}</div></div>`}catch(e){h+=`<div class="empty">${esc(e.message)}</div>`}
 try{const q=await api('/quota/overview');h+=`<h4>Crédits et missions</h4><div class="kpis">${kpi('Utilisateurs avec solde',q.users)}${kpi('Solde moyen',q.avg_balance)}${kpi('Objectif moyen / jour',q.avg_daily_target)}${kpi('Besoin global',Math.round(q.context.need_global*100)+' %')}${kpi('Contributeurs actifs (7 j)',q.context.supply)}${kpi('Déficit de mesures',Math.round(q.context.deficit))}</div>`}catch{}
 try{const r=await api('/missions/ranking/active');h+=`<div class="card tw" style="padding:0"><div style="padding:14px"><h3 style="margin:0">Utilisateurs les plus actifs</h3></div><table><thead><tr><th>Pseudonyme</th><th>Score</th><th>Activité 14 j</th><th>Fiabilité</th><th>Missions réussies</th><th>Acceptation</th><th>En cours</th></tr></thead><tbody>${r.map(u=>`<tr><td>${esc(u.pseudonym)}</td><td>${Math.round(u.score*100)} %</td><td>${u.activity_14d}</td><td>${Math.round(u.reliability*100)} %</td><td>${Math.round(u.completion*100)} %</td><td>${Math.round(u.acceptance*100)} %</td><td>${u.load}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Aucun utilisateur éligible.</td></tr>'}</tbody></table></div>`}catch{}
 el.innerHTML=h}
</script></body></html>
